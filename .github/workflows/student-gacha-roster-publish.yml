name: Publish Student Gacha Roster

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions: {}

env:
  AWS_REGION: ap-northeast-1
  AWS_PAGER: ""
  GH_PROMPT_DISABLED: "1"

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: student-gacha-roster
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Require enabled dispatch from protected main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_ENABLED: ${{ vars.STUDENT_GACHA_ROSTER_RELEASE_ENABLED }}
        run: |
          test "${RELEASE_ENABLED}" = true
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = pitekusu/shittim-chest
          test "${GITHUB_REPOSITORY_ID}" = 1302516701
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/student-gacha-roster-release.yml@refs/heads/main"
          [[ "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "${GITHUB_WORKFLOW_SHA}" = "${EXPECTED_SHA}"
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          PY_TLS
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Verify same-SHA main gates and the roster
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          python3 tools/check_release_ci.py
          python3 -m tools.update_student_gacha_roster --check
      - name: Resolve the roster release identity
        id: identity
        env:
          RELEASE_PLAN_ROLE: ${{ vars.AWS_RELEASE_PLAN_ROLE_ARN }}
        run: |
          [[ "${RELEASE_PLAN_ROLE}" =~ ^arn:aws:iam::([0-9]{12}):role/ShittimChest-Prod-GitHub-ReleasePlan$ ]]
          account=${BASH_REMATCH[1]}
          echo "::add-mask::${account}"
          {
            echo "account=${account}"
            echo "role=arn:aws:iam::${account}:role/ShittimChest-Prod-GitHub-StudentGachaRosterRelease"
          } >> "${GITHUB_OUTPUT}"
      - name: Acquire credentials for the single roster object
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.identity.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ steps.identity.outputs.account }}
          role-session-name: roster-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Publish and verify the versioned roster
        env:
          GH_TOKEN: ${{ github.token }}
          ROSTER_ACCOUNT: ${{ steps.identity.outputs.account }}
        run: bash tools/publish_student_gacha_roster.sh
