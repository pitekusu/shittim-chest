name: Records CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: records-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.14.6"
  UV_VERSION: "0.11.29"

jobs:
  records-changes:
    name: records-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      records: ${{ steps.classify.outputs.records }}
    steps:
      - name: Check out the tested history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify Records changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="${BASE_SHA}"
          if [ -z "${base_sha}" ] ||
             [ "${base_sha}" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null
          then
            base_sha=$(git rev-parse "${GITHUB_SHA}^")
          fi
          python3 tools/classify_ci_paths.py \
            --base "${base_sha}" \
            --head "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  records-python:
    name: records-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records == 'true'
    defaults:
      run:
        working-directory: services/records
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Verify and synchronize the Records lock
        run: |
          uv lock --check
          uv sync --frozen --all-groups
      - name: Check Records formatting, lint, and types
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen ty check
      - name: Run Records unit tests
        run: uv run --frozen pytest

  records-contract:
    name: records-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records == 'true'
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Synchronize the Records environment
        run: uv sync --project services/records --frozen --all-groups
      - name: Require byte-identical public contracts
        run: |
          uv run --project services/records --frozen \
            python -m shittim_records.generate_contracts \
            --output contracts/records/v1 \
            --check

  records-web:
    name: records-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records == 'true'
    defaults:
      run:
        working-directory: apps/records-web
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the package-manager version declared by Records web
        run: |
          corepack enable pnpm
          test "$(pnpm --version)" = "11.21.0"
      - name: Install locked Records web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Records web formatting, lint, and types
        run: pnpm exec vp check
      - name: Test Records web
        run: pnpm exec vp test
      - name: Build Records web
        run: pnpm exec vp build
      - name: Audit Records web dependencies
        run: pnpm audit --audit-level=low

  records-gate:
    name: records-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - records-changes
      - records-python
      - records-contract
      - records-web
    steps:
      - name: Preserve one required Records result
        env:
          REQUIRED: ${{ needs.records-changes.outputs.records }}
          PYTHON_RESULT: ${{ needs.records-python.result }}
          CONTRACT_RESULT: ${{ needs.records-contract.result }}
          WEB_RESULT: ${{ needs.records-web.result }}
        run: |
          if [ "${REQUIRED}" = true ]; then
            test "${PYTHON_RESULT}" = success
            test "${CONTRACT_RESULT}" = success
            test "${WEB_RESULT}" = success
          else
            test "${PYTHON_RESULT}" = skipped
            test "${CONTRACT_RESULT}" = skipped
            test "${WEB_RESULT}" = skipped
            echo "Records inputs are unchanged."
          fi
