name: Records CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: records-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  NODE_VERSION: "24.22.1"
  PYTHON_VERSION: "3.14.9"
  UV_VERSION: "0.13.5"
  UV_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/.github/uv-manifest.ndjson

jobs:
  records-changes:
    name: records-changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      records_python: ${{ steps.classify.outputs.records_python }}
      records_contract: ${{ steps.classify.outputs.records_contract }}
      records_web: ${{ steps.classify.outputs.records_web }}
      records_web_dependencies: ${{ steps.classify.outputs.records_web_dependencies }}
      records_infra: ${{ steps.classify.outputs.records_infra }}
      records: ${{ steps.classify.outputs.records }}
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Classify Records changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          base_sha="${BASE_SHA}"
          if [ -z "${base_sha}" ] ||
             [ "${base_sha}" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null
          then
            base_sha=$(git rev-parse "${GITHUB_SHA}^")
          fi
          scope_args=()
          if [ "${FULL_CHECK}" = true ]; then
            scope_args+=(--all)
          fi
          python3 tools/classify_ci_paths.py \
            --base "${base_sha}" \
            --head "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}" "${scope_args[@]}"
          if [ "${FULL_CHECK}" = true ] ||
             ! git diff --quiet "${base_sha}...${GITHUB_SHA}" -- \
               .npmrc apps/records-web/.npmrc \
               apps/records-web/package.json \
               apps/records-web/pnpm-lock.yaml \
               apps/records-web/pnpm-workspace.yaml
          then
            echo 'records_web_dependencies=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'records_web_dependencies=false' >>"${GITHUB_OUTPUT}"
          fi

  records-python:
    name: records-python
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records_python == 'true'
    defaults:
      run:
        working-directory: services/records
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          manifest-file: ${{ env.UV_MANIFEST_URL }}
          download-from-astral-mirror: false
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Verify and synchronize the Records lock
        run: |
          uv lock --check
          uv sync --frozen --all-groups
      - name: Audit locked Records Python dependencies
        run: |
          uv export --quiet --frozen --all-groups --no-emit-local --no-annotate \
            --output-file "${RUNNER_TEMP}/records-audit-requirements.txt"
          uv run --frozen pip-audit --strict --require-hashes \
            --requirement "${RUNNER_TEMP}/records-audit-requirements.txt"
      - name: Check Records formatting, lint, and types
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen ty check
      - name: Run Records unit tests
        run: uv run --frozen pytest
      - name: Verify the Records botocore fallback trust store
        run: >-
          uv run --frozen pytest -c pyproject.toml -o pythonpath=../..
          ../../tests/unit/adapters/test_botocore_tls.py
      - name: Run Records DynamoDB Local integration tests
        run: |
          uv run --frozen python ../../tools/run_dynamodb_local.py -- \
            uv run --frozen pytest tests/test_dynamodb_integration.py

  records-contract:
    name: records-contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records_contract == 'true'
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          manifest-file: ${{ env.UV_MANIFEST_URL }}
          download-from-astral-mirror: false
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Synchronize the Records environment
        run: uv sync --project services/records --frozen --all-groups
      - name: Require byte-identical public contracts
        run: |
          uv run --project services/records --frozen \
            python -m shittim_records.generate_contracts \
            --output contracts/records/v1 \
            --check

  records-web:
    name: records-web
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: records-changes
    if: needs.records-changes.outputs.records_web == 'true'
    defaults:
      run:
        working-directory: apps/records-web
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Set up the pinned Records Web toolchain
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: apps/records-web
          run-install: false
          cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked Records web dependencies
        run: |
          test "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.slice("pnpm@".length)')"
          vp install --frozen-lockfile
      - name: Verify Records web dependency signatures
        if: needs.records-changes.outputs.records_web_dependencies == 'true'
        run: pnpm audit signatures
      - name: Check Records web formatting, lint, and types
        run: pnpm exec vp check
      - name: Test Records web
        id: unit-tests
        env:
          VITEST_HTML_REPORT: "1"
        run: pnpm exec vp test
      - name: Preserve Records unit test HTML report
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-web-vitest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/records-web/.vitest/index.html
          include-hidden-files: true
          archive: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Records web
        run: pnpm run build
      - name: Install the pinned browser for Records acceptance tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test Records browser flows and visual contracts
        id: browser-tests
        run: pnpm exec playwright test
      - name: Preserve Records browser comparison images
        if: ${{ failure() && steps.browser-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-web-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/records-web/test-results/**/*-actual.png
            apps/records-web/test-results/**/*-expected.png
            apps/records-web/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit Records web dependencies
        run: python3 ../../tools/run_npm_audit.py -- pnpm audit --audit-level=low

  records-infra:
    name: records-infra
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: records-changes
    if: needs.records-changes.outputs.records_infra == 'true'
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked CDK dependencies
        run: npm ci --ignore-scripts
      # The required CI cdk job owns the shared audit, type-check, and all infra tests.
      - name: Synthesize the Records infrastructure
        run: npm run synth:records

  records-gate:
    name: records-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: always()
    needs:
      - records-changes
      - records-python
      - records-contract
      - records-web
      - records-infra
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Preserve one required Records result
        env:
          CI_CHANGES_RESULT: ${{ needs.records-changes.result }}
          CI_SCOPES: ${{ toJSON(needs.records-changes.outputs) }}
          CI_DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/check_ci_scope.py
          --job records-python=records_python
          --job records-contract=records_contract
          --job records-web=records_web
          --job records-infra=records_infra
