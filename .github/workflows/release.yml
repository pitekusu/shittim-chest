name: Production Release

on:
  workflow_dispatch:
    inputs:
      runtime_config_version:
        description: "事前登録済みのversioned runtime config"
        required: true
        default: v0004
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  COST_REGION: us-east-1
  PYTHON_VERSION: 3.14.6
  PYTHONDONTWRITEBYTECODE: "1"
  UV_VERSION: 0.11.29
  AWS_SIGNER_NOTATION_INSTALLER_VERSION: 2.2.0-1
  NOTATION_CLI_VERSION: 1.3.2
  AWS_SIGNER_NOTATION_PLUGIN_VERSION: 1.0.2292
  AWS_SIGNER_NOTATION_ARCHIVE_SHA256: ae6251ebe0d1aee019e6427a34e7c1c5f1e1f579acf7e8f9fb7dd777eb9117c8
  AWS_SIGNER_NOTATION_SIGNATURE_SHA256: ef9bb5125579e1ca24f9508ac0903b7db4afcc20a31333c9203c784e8c34cf6b
  AWS_SIGNER_NOTATION_KEY_SHA256: e215d69bf0bd59d7a2efe165d7fb777201364f76328702248f8b82b30ec41991
  AWS_SIGNER_NOTATION_FINGERPRINT: E84AF8A2A9B52F1F4435AE71A3B52DA65461CF90
  ECR_CREDENTIAL_HELPER_VERSION: 0.12.0
  ECR_CREDENTIAL_HELPER_SHA256: 5bdd30fb6c7a92462f5b454cce1aa906ca7926a6c2e39efad9613a7bf7661fac
  AWS_ECR_DISABLE_CACHE: "true"
  RELEASE_IMAGE_CONTEXT: ${{ github.workspace }}/release-image-context

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      evidence_name: ${{ steps.evidence.outputs.artifact_name }}
      plan_attempt: ${{ steps.evidence.outputs.run_attempt }}
    permissions:
      attestations: write
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Require the immutable main branch
        env:
          EXPECTED_REF: refs/heads/main
          EXPECTED_REPOSITORY: pitekusu/shittim-chest
          EXPECTED_REPOSITORY_ID: "1302516701"
        run: |
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REPOSITORY_ID}" = "${EXPECTED_REPOSITORY_ID}"
          test "${GITHUB_SHA}" = "${GITHUB_WORKFLOW_SHA}"
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require immutable OIDC identity and successful main gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          oidc=$(gh api repos/pitekusu/shittim-chest/actions/oidc/customization/sub \
            -H 'X-GitHub-Api-Version: 2026-03-10')
          jq --exit-status \
            '.use_default == true and .use_immutable_subject == true and
             .sub_claim_prefix == "repo:pitekusu@12059348/shittim-chest@1302516701"' \
            <<< "${oidc}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          for check in \
            quality tests security package cdk docs-public-safety container-arm64 grype \
            'Analyze (python)' 'Analyze (javascript-typescript)' 'Analyze (actions)'
          do
            jq --exit-status --arg check "${check}" \
              '.check_runs | map(select(.name == $check)) | sort_by(.id) | last |
               .conclusion == "success"' \
              "${RUNNER_TEMP}/check-runs.json" >/dev/null
          done
          token_response=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          jwt=$(jq --exit-status --raw-output .value <<< "${token_response}")
          payload="${jwt#*.}"
          payload="${payload%%.*}"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
            0) ;;
            *) exit 1 ;;
          esac
          printf '%s' "${payload}" | tr '_-' '/+' | base64 --decode \
            > "${RUNNER_TEMP}/oidc-claims.json"
          jq --exit-status \
            '.aud == "sts.amazonaws.com" and
             .sub == "repo:pitekusu@12059348/shittim-chest@1302516701:ref:refs/heads/main" and
             .repository_id == "1302516701" and
             .repository_owner_id == "12059348" and
             .ref == "refs/heads/main"' \
            "${RUNNER_TEMP}/oidc-claims.json" >/dev/null
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install locked test environments
        run: |
          uv sync --frozen --all-groups
          npm ci --ignore-scripts
      - name: Re-run release-critical local gates
        run: |
          uv run --frozen pytest
          npm run check:infra
      - name: Validate required private configuration handles
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          COST_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_US_EAST_1 }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          MONITOR_ARN: ${{ vars.EXISTING_SERVICE_ANOMALY_MONITOR_ARN }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_NOTIFICATION_EMAIL }}
          PLAN_ROLE_ARN: ${{ vars.AWS_RELEASE_PLAN_ROLE_ARN }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
          TOKYO_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_TOKYO }}
        run: |
          for value in \
            "${ASSET_BUCKET}" \
            "${COST_EXECUTION_ROLE}" \
            "${ECR_REPOSITORY_URI}" \
            "${MONITOR_ARN}" \
            "${OPERATOR_EMAIL}" \
            "${PLAN_ROLE_ARN}" \
            "${SIGNING_PROFILE_ARN}" \
            "${TOKYO_EXECUTION_ROLE}"
          do
            test -n "${value}"
          done
          case "${ECR_REPOSITORY_URI}" in
            *.dkr.ecr.ap-northeast-1.amazonaws.com/shittim-chest) ;;
            *) exit 1 ;;
          esac
      - name: Acquire plan-only AWS credentials
        id: plan_aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Bind all public AWS handles to the assumed production account
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          COST_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_US_EAST_1 }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          PLAN_ROLE_ARN: ${{ vars.AWS_RELEASE_PLAN_ROLE_ARN }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
          TOKYO_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_TOKYO }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "${account}" =~ ^[0-9]{12}$ ]]
          test "${ASSET_BUCKET}" = "cdk-hnb659fds-assets-${account}-${AWS_REGION}"
          test "${ECR_REPOSITORY_URI}" = \
            "${account}.dkr.ecr.${AWS_REGION}.amazonaws.com/shittim-chest"
          test "${PLAN_ROLE_ARN}" = \
            "arn:aws:iam::${account}:role/ShittimChest-Prod-GitHub-ReleasePlan"
          test "${TOKYO_EXECUTION_ROLE}" = \
            "arn:aws:iam::${account}:role/cdk-hnb659fds-cfn-exec-role-${account}-${AWS_REGION}"
          test "${COST_EXECUTION_ROLE}" = \
            "arn:aws:iam::${account}:role/cdk-hnb659fds-cfn-exec-role-${account}-${COST_REGION}"
          [[ "${SIGNING_PROFILE_ARN}" =~ ^arn:aws:signer:${AWS_REGION}:${account}:/signing-profiles/shittim_chest_ecr$ ]]
          echo "CDK_DEFAULT_ACCOUNT=${account}" >> "${GITHUB_ENV}"
          echo "CDK_DEFAULT_REGION=${AWS_REGION}" >> "${GITHUB_ENV}"
      - name: Require the active Project cost-allocation tag
        run: |
          aws ce list-cost-allocation-tags \
            --region "${COST_REGION}" \
            --status Active \
            --tag-keys Project \
            --output json > "${RUNNER_TEMP}/cost-allocation-tags.json"
          jq --exit-status \
            '.CostAllocationTags | map({Status, TagKey, Type}) == [{"Status":"Active","TagKey":"Project","Type":"UserDefined"}]' \
            "${RUNNER_TEMP}/cost-allocation-tags.json" >/dev/null
      - name: Recover stale unexecuted release change sets before planning
        run: |
          change_set_name="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash tools/cleanup_release_change_sets.sh \
            --stale-before-plan "${change_set_name}"
      - name: Fail fast on unstable stacks, stale plans, and unavailable AWS APIs
        env:
          MONITOR_ARN: ${{ vars.EXISTING_SERVICE_ANOMALY_MONITOR_ARN }}
          RUNTIME_CONFIG_VERSION: ${{ inputs.runtime_config_version }}
        run: |
          require_release_stack() {
            local stack="$1" region="$2" required="$3" status
            if ! status=$(aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" --query 'Stacks[0].StackStatus' --output text \
              2>"${RUNNER_TEMP}/describe-${stack}.error")
            then
              grep --fixed-strings '(ValidationError)' \
                "${RUNNER_TEMP}/describe-${stack}.error" >/dev/null
              grep --fixed-strings 'does not exist' \
                "${RUNNER_TEMP}/describe-${stack}.error" >/dev/null
              test "${required}" = optional
              return
            fi
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              REVIEW_IN_PROGRESS)
                aws cloudformation describe-stack-resources --region "${region}" \
                  --stack-name "${stack}" --output json \
                  > "${RUNNER_TEMP}/${stack}.resources.json"
                jq --exit-status '.StackResources | length == 0' \
                  "${RUNNER_TEMP}/${stack}.resources.json" >/dev/null
                ;;
              *)
                echo "::error::${stack} is not in an allowed stable state: ${status}" >&2
                return 1
                ;;
            esac
            aws cloudformation list-change-sets --region "${region}" \
              --stack-name "${stack}" --output json \
              > "${RUNNER_TEMP}/${stack}.change-sets.json"
            jq --exit-status \
              '[.Summaries[] | select(
                (.ExecutionStatus == "AVAILABLE" or .ExecutionStatus == "UNAVAILABLE") and
                (.ChangeSetName | startswith("release-"))
              )] | length == 0' \
              "${RUNNER_TEMP}/${stack}.change-sets.json" >/dev/null
          }
          require_release_stack ShittimChest-Prod-Stateful "${AWS_REGION}" required
          require_release_stack ShittimChest-Prod-Runtime "${AWS_REGION}" optional
          require_release_stack ShittimChest-Prod-Operations "${AWS_REGION}" optional
          require_release_stack ShittimChest-Prod-CostGovernance "${COST_REGION}" optional
          aws signer get-signing-profile --profile-name shittim_chest_ecr >/dev/null
          aws ecr describe-repositories --repository-names shittim-chest >/dev/null
          aws inspector2 list-account-permissions --service ECR --max-items 50 >/dev/null
          aws inspector2 list-coverage --max-items 1 >/dev/null
          [[ "${RUNTIME_CONFIG_VERSION}" =~ ^v[0-9]{4}$ ]]
          aws ssm describe-parameters \
            --parameter-filters \
              'Key=Path,Option=Recursive,Values=/shittim-chest/production' \
            --output json > "${RUNNER_TEMP}/production-parameters.json"
          jq --exit-status --arg version "${RUNTIME_CONFIG_VERSION}" '
            [
              "/shittim-chest/production/openai/api-key",
              "/shittim-chest/production/discord/moderator/public-key",
              "/shittim-chest/production/discord/moderator/token",
              "/shittim-chest/production/discord/participant-a/token",
              "/shittim-chest/production/discord/participant-b/token",
              "/shittim-chest/production/discord/participant-c/token",
              "/shittim-chest/production/runtime/\($version)",
              "/shittim-chest/production/personas/\($version)/moderator",
              "/shittim-chest/production/personas/\($version)/participant-a",
              "/shittim-chest/production/personas/\($version)/participant-b",
              "/shittim-chest/production/personas/\($version)/participant-c"
            ] as $expected |
            ([.Parameters[] | select(.Name as $name | $expected | index($name)) |
              {Name,Type,Tier,Version}] | sort_by(.Name)) as $actual |
            ($expected | map({Name:.,Type:"SecureString",Tier:"Standard"}) |
              sort_by(.Name)) as $metadata |
            ($actual | length) == 11 and
            ($actual | map(del(.Version))) == $metadata and
            ($actual | all(.Version >= 1))' \
            "${RUNNER_TEMP}/production-parameters.json" >/dev/null
          aws ce get-anomaly-monitors --monitor-arn-list "${MONITOR_ARN}" \
            --region "${COST_REGION}" --output json \
            > "${RUNNER_TEMP}/anomaly-monitor.json"
          jq --exit-status '.AnomalyMonitors | length == 1' \
            "${RUNNER_TEMP}/anomaly-monitor.json" >/dev/null
          aws cloudformation describe-events --generate-cli-skeleton input >/dev/null
      - name: Synthesize and publish the complete CDK asset closure
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
        run: |
          npm run synth -- --output "${RUNNER_TEMP}/cdk.out"
          uv run --frozen python tools/release_supply_chain.py create-cdk-assets \
            --account "${CDK_DEFAULT_ACCOUNT}" \
            --assembly "${RUNNER_TEMP}/cdk.out" \
            --output "${RUNNER_TEMP}/cdk-assets.unpublished.json"
          npm run cdk -- publish-assets \
            Stateful Runtime Operations CostGovernance \
            --app "${RUNNER_TEMP}/cdk.out" \
            --exclusively \
            --unstable=publish-assets \
            --concurrency 1 \
            --force \
            --ci
          jq --null-input '[]' > "${RUNNER_TEMP}/cdk-asset-checksums.json"
          while IFS= read -r asset
          do
            region=$(jq --raw-output .region <<< "${asset}")
            bucket=$(jq --raw-output .bucket <<< "${asset}")
            object_key=$(jq --raw-output .object_key <<< "${asset}")
            aws s3api head-object --region "${region}" \
              --bucket "${bucket}" --key "${object_key}" --checksum-mode ENABLED \
              > "${RUNNER_TEMP}/cdk-asset-head.json"
            checksum=$(jq --exit-status --raw-output \
              '.ChecksumSHA256 | select(type == "string" and length > 0)' \
              "${RUNNER_TEMP}/cdk-asset-head.json")
            jq --argjson asset "${asset}" --arg checksum "${checksum}" \
              '. + [{asset_id:$asset.asset_id,bucket:$asset.bucket,
                checksum_sha256:$checksum,object_key:$asset.object_key,
                region:$asset.region}]' "${RUNNER_TEMP}/cdk-asset-checksums.json" \
              > "${RUNNER_TEMP}/cdk-asset-checksums.next.json"
            mv "${RUNNER_TEMP}/cdk-asset-checksums.next.json" \
              "${RUNNER_TEMP}/cdk-asset-checksums.json"
          done < <(jq --compact-output '.files[]' \
            "${RUNNER_TEMP}/cdk-assets.unpublished.json")
          uv run --frozen python tools/release_supply_chain.py bind-cdk-asset-checksums \
            "${RUNNER_TEMP}/cdk-assets.unpublished.json" \
            --account "${CDK_DEFAULT_ACCOUNT}" \
            --assembly "${RUNNER_TEMP}/cdk.out" \
            --checksums "${RUNNER_TEMP}/cdk-asset-checksums.json" \
            --output "${RUNNER_TEMP}/cdk-assets.json"
          jq --null-input '{}' > "${RUNNER_TEMP}/template-hashes.json"
          for mapping in \
            'ShittimChest-Prod-Stateful=Stateful' \
            'ShittimChest-Prod-Runtime=Runtime' \
            'ShittimChest-Prod-Operations=Operations' \
            'ShittimChest-Prod-CostGovernance=CostGovernance'
          do
            stack="${mapping%%=*}"
            artifact="${mapping#*=}"
            template="${RUNNER_TEMP}/cdk.out/${artifact}.template.json"
            test -f "${template}"
            template_sha=$(sha256sum "${template}" | cut -d ' ' -f 1)
            jq --arg stack "${stack}" --arg sha "${template_sha}" \
              '. + {($stack):$sha}' "${RUNNER_TEMP}/template-hashes.json" \
              > "${RUNNER_TEMP}/template-hashes.next.json"
            mv "${RUNNER_TEMP}/template-hashes.next.json" \
              "${RUNNER_TEMP}/template-hashes.json"
            if [ "${artifact}" = "Runtime" ]; then
              template_key="templates/shittim-chest/${template_sha}/Runtime.template.json"
              expected_checksum=$(printf '%s' "${template_sha}" | xxd -r -p | base64 -w 0)
              if aws s3api head-object --bucket "${ASSET_BUCKET}" --key "${template_key}" \
                --checksum-mode ENABLED > "${RUNNER_TEMP}/runtime-template-head.json" \
                2>/dev/null
              then
                test "$(jq --raw-output .ChecksumSHA256 \
                  "${RUNNER_TEMP}/runtime-template-head.json")" = "${expected_checksum}"
              else
                aws s3api put-object --bucket "${ASSET_BUCKET}" --key "${template_key}" \
                  --body "${template}" --content-type application/json \
                  --checksum-algorithm SHA256 --if-none-match '*' >/dev/null
              fi
              echo "RUNTIME_TEMPLATE_KEY=${template_key}" >> "${GITHUB_ENV}"
            fi
          done
      - name: Install pinned Syft, Grype, and Docker Scout
        run: |
          install_tool() {
            local name="$1" key="$2" binary="$3"
            local version archive_name archive_sha archive
            version=$(jq --raw-output --arg key "${key}" '.tools[$key].version' \
              .github/tool-versions.json)
            archive_name=$(jq --raw-output --arg key "${key}" '.tools[$key].archive_name' \
              .github/tool-versions.json)
            archive_sha=$(jq --raw-output --arg key "${key}" '.tools[$key].archive_sha256' \
              .github/tool-versions.json)
            archive="${RUNNER_TEMP}/${archive_name}"
            curl --fail --location --proto '=https' --show-error --silent --tlsv1.2 \
              --output "${archive}" \
              "https://github.com/${name}/releases/download/v${version}/${archive_name}"
            printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum --check --strict
            tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" "${binary}"
          }
          install_tool anchore/syft syft syft
          install_tool anchore/grype grype-arm64 grype
          install_tool docker/scout-cli docker-scout docker-scout
      - name: Install and cryptographically verify AWS Signer Notation
        run: bash tools/install_aws_signer_notation.sh
      - name: Authenticate to immutable source and destination registries
        env:
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          test -n "${DHI_USERNAME}"
          test -n "${DHI_TOKEN}"
          printf '%s' "${DHI_TOKEN}" | docker login dhi.io \
            --username "${DHI_USERNAME}" --password-stdin
          registry="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS --password-stdin "${registry}"
      - name: Install and configure the pinned ECR credential helper
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          bash tools/install_ecr_credential_helper.sh "${registry}"
      - name: Prepare pinned vulnerability data before image push
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DHI_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DHI_TOKEN }}
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          "${RUNNER_TEMP}/grype" db update
          normal_base=$(uv run --frozen python tools/check_container_policy.py \
            --print-reference runtime)
          "${RUNNER_TEMP}/docker-scout" vex get --verify --skip-tlog \
            --platform linux/arm64 --output "${RUNNER_TEMP}/normal.openvex.json" \
            "registry://${normal_base}"
      - name: Check out the immutable image build context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-image-context
          persist-credentials: false
      - name: Require the immutable clean image build context
        run: |
          test "$(git -C "${RELEASE_IMAGE_CONTEXT}" rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C "${RELEASE_IMAGE_CONTEXT}" rev-parse --show-toplevel)" = \
            "${RELEASE_IMAGE_CONTEXT}"
          test -z "$(git -C "${RELEASE_IMAGE_CONTEXT}" status \
            --porcelain=v1 --untracked-files=all)"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      - name: Build and load the production image once
        id: build-normal
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ env.RELEASE_IMAGE_CONTEXT }}
          file: ${{ env.RELEASE_IMAGE_CONTEXT }}/Dockerfile
          target: production
          no-cache-filters: builder,runtime-base
          outputs: type=docker,rewrite-timestamp=true,compression=gzip,compression-level=6,force-compression=true
          tags: ${{ vars.ECR_REPOSITORY_URI }}:release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=container-arm64-production
          cache-to: type=gha,mode=max,scope=container-arm64-production,ignore-error=true
      - name: Validate release image configs before push
        env:
          NORMAL_CONFIG_DIGEST: ${{ steps.build-normal.outputs.imageid }}
        run: |
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "${NORMAL_CONFIG_DIGEST}" =~ ${digest_pattern} ]]
          printf '%s\n' "${NORMAL_CONFIG_DIGEST}" > "${RUNNER_TEMP}/normal.config-digest"
          uv run --frozen python tools/check_container_risk_acceptance.py \
            --policy security/container-risk-acceptance.json \
            --image-kind production \
            --image-config-digest-file "${RUNNER_TEMP}/normal.config-digest" \
            --config-digest-only
      - name: Push the prevalidated image once
        id: push-images
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          NORMAL_CONFIG_DIGEST: ${{ steps.build-normal.outputs.imageid }}
        run: |
          digest_pattern='^sha256:[0-9a-f]{64}$'
          repository="${ECR_REPOSITORY_URI##*/}"
          normal_tag="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          normal_image="${ECR_REPOSITORY_URI}:${normal_tag}"
          test "$(docker image inspect "${normal_image}" --format '{{.Id}}')" = \
            "${NORMAL_CONFIG_DIGEST}"
          docker image push --quiet "${normal_image}" >/dev/null
          inspect_pushed_image() {
            local mode="$1" tag="$2" expected_config="$3"
            local manifest_digest manifest actual_config
            manifest_digest=$(aws ecr describe-images --region "${AWS_REGION}" \
              --repository-name "${repository}" --image-ids "imageTag=${tag}" \
              --query 'imageDetails[0].imageDigest' --output text)
            [[ "${manifest_digest}" =~ ${digest_pattern} ]]
            manifest=$(aws ecr batch-get-image --region "${AWS_REGION}" \
              --repository-name "${repository}" --image-ids "imageDigest=${manifest_digest}" \
              --accepted-media-types \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageManifest' --output text)
            actual_config=$(jq --exit-status --raw-output \
              '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${manifest}")
            test "${actual_config}" = "${expected_config}"
            printf '%s\n' "${manifest}" > "${RUNNER_TEMP}/${mode}.manifest.json"
            printf '%s' "${manifest_digest}"
          }
          normal_digest=$(inspect_pushed_image normal "${normal_tag}" \
            "${NORMAL_CONFIG_DIGEST}")
          echo "normal_digest=${normal_digest}" >> "${GITHUB_OUTPUT}"
      - name: Record immutable image references
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          NORMAL_DIGEST: ${{ steps.push-images.outputs.normal_digest }}
        run: |
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "${NORMAL_DIGEST}" =~ ${digest_pattern} ]]
          normal_reference="${ECR_REPOSITORY_URI}@${NORMAL_DIGEST}"
          normal_config_digest=$(jq --exit-status --raw-output \
            '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            "${RUNNER_TEMP}/normal.manifest.json")
          printf '%s\n' "${normal_config_digest}" > "${RUNNER_TEMP}/normal.config-digest"
          {
            echo "NORMAL_DIGEST=${NORMAL_DIGEST}"
            echo "NORMAL_REFERENCE=${normal_reference}"
          } >> "${GITHUB_ENV}"
      - name: Generate the pushed-digest SPDX SBOM
        run: |
          "${RUNNER_TEMP}/syft" "registry:${NORMAL_REFERENCE}" \
            --output "spdx-json=${RUNNER_TEMP}/normal.spdx.json"
          uv run --frozen python tools/check_image_sbom.py \
            "${RUNNER_TEMP}/normal.spdx.json"
      - name: Apply signed vendor VEX and the time-bounded risk policy
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          fixable_status=0
          "${RUNNER_TEMP}/grype" "sbom:${RUNNER_TEMP}/normal.spdx.json" \
            --output "json=${RUNNER_TEMP}/normal.raw-grype.json"
          "${RUNNER_TEMP}/grype" "sbom:${RUNNER_TEMP}/normal.spdx.json" \
            --vex "${RUNNER_TEMP}/normal.openvex.json" \
            --output "json=${RUNNER_TEMP}/normal.vex-grype.json"
          "${RUNNER_TEMP}/grype" "sbom:${RUNNER_TEMP}/normal.spdx.json" \
            --name "normal-image-actionable" \
            --only-fixed \
            --fail-on high || fixable_status=$?
          if [ "${fixable_status}" -ne 0 ]
          then
            echo "Fixable High/Critical in a rebuilt release image blocks deployment." >&2
            exit "${fixable_status}"
          fi
          printf '%s\n' "${NORMAL_DIGEST}" > "${RUNNER_TEMP}/normal.digest"
          uv run --frozen python tools/check_container_risk_acceptance.py \
            --policy security/container-risk-acceptance.json \
            --raw-report "${RUNNER_TEMP}/normal.raw-grype.json" \
            --vex-report "${RUNNER_TEMP}/normal.vex-grype.json" \
            --image-kind production \
            --image-config-digest-file "${RUNNER_TEMP}/normal.config-digest"
      - name: Wait for managed signing and enhanced ECR scans
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
        run: |
          repository="${ECR_REPOSITORY_URI##*/}"
          bash tools/wait_release_image_evidence.sh \
            --repository "${repository}" \
            --digest "${NORMAL_DIGEST}" \
            --signing-profile-arn "${SIGNING_PROFILE_ARN}" \
            --output-dir "${RUNNER_TEMP}"
          uv run --frozen python tools/release_supply_chain.py \
            create-vulnerability-predicate \
            --digest "${NORMAL_DIGEST}" \
            --coverage "${RUNNER_TEMP}/normal.coverage.json" \
            --scan "${RUNNER_TEMP}/normal.scan.json" \
            --risk-gate-passed \
            --output "${RUNNER_TEMP}/normal.vulnerability.json"
      - name: Capture ACTIVE referrer baselines before attestations
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          repository="${ECR_REPOSITORY_URI##*/}"
          aws ecr list-image-referrers \
            --repository-name "${repository}" \
            --subject-id "imageDigest=${NORMAL_DIGEST}" \
            --output json > "${RUNNER_TEMP}/normal.referrers-before.json"
      - name: Attest normal image provenance
        id: attest_normal_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ vars.ECR_REPOSITORY_URI }}
          subject-digest: ${{ steps.push-images.outputs.normal_digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false
      - name: Attest normal image SBOM
        id: attest_normal_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ vars.ECR_REPOSITORY_URI }}
          subject-digest: ${{ steps.push-images.outputs.normal_digest }}
          sbom-path: ${{ runner.temp }}/normal.spdx.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false
      - name: Attest normal image vulnerability assessment
        id: attest_normal_vulnerability
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ vars.ECR_REPOSITORY_URI }}
          subject-digest: ${{ steps.push-images.outputs.normal_digest }}
          predicate-type: https://github.com/pitekusu/shittim-chest/attestations/vulnerability-assessment/v1
          predicate-path: ${{ runner.temp }}/normal.vulnerability.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false
      - name: Strictly verify the Signer identity and four referrers
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
        run: |
          repository="${ECR_REPOSITORY_URI##*/}"
          jq --null-input \
            --arg repository "${ECR_REPOSITORY_URI}" \
            --arg profile "${SIGNING_PROFILE_ARN}" \
            '{version:"1.0",trustPolicies:[{name:"shittim-chest-release",registryScopes:[$repository],signatureVerification:{level:"strict"},trustStores:["signingAuthority:aws-signer-ts"],trustedIdentities:[$profile]}]}' \
            > "${RUNNER_TEMP}/notation-trust-policy.json"
          notation policy import --force "${RUNNER_TEMP}/notation-trust-policy.json"
          notation verify "${NORMAL_REFERENCE}"
          notation inspect --output json "${NORMAL_REFERENCE}" \
            > "${RUNNER_TEMP}/normal.notation.json"
          aws ecr list-image-referrers \
            --repository-name "${repository}" \
            --subject-id "imageDigest=${NORMAL_DIGEST}" \
            --output json > "${RUNNER_TEMP}/normal.referrers-after.json"
          uv run --frozen python tools/release_supply_chain.py \
            select-release-referrers \
            --before-referrers "${RUNNER_TEMP}/normal.referrers-before.json" \
            --after-referrers "${RUNNER_TEMP}/normal.referrers-after.json" \
            --notation-inspection "${RUNNER_TEMP}/normal.notation.json" \
            --profile-arn "${SIGNING_PROFILE_ARN}" \
            --output "${RUNNER_TEMP}/normal.referrers.json"
          uv run --frozen python tools/release_supply_chain.py verify-image \
            --digest "${NORMAL_DIGEST}" \
            --coverage "${RUNNER_TEMP}/normal.coverage.json" \
            --image-details "${RUNNER_TEMP}/normal.image.json" \
            --profile-arn "${SIGNING_PROFILE_ARN}" \
            --signing-status "${RUNNER_TEMP}/normal.signing.json" \
            --referrers "${RUNNER_TEMP}/normal.referrers.json" \
            --scan "${RUNNER_TEMP}/normal.scan.json" \
            --risk-gate-passed \
            --output "${RUNNER_TEMP}/normal.verification.json"
          for predicate in \
            https://slsa.dev/provenance/v1 \
            https://spdx.dev/Document/v2.3 \
            https://github.com/pitekusu/shittim-chest/attestations/vulnerability-assessment/v1
          do
            gh attestation verify "oci://${ECR_REPOSITORY_URI}@${NORMAL_DIGEST}" \
              --bundle-from-oci \
              --deny-self-hosted-runners \
              --repo pitekusu/shittim-chest \
              --signer-digest "${GITHUB_SHA}" \
              --signer-workflow pitekusu/shittim-chest/.github/workflows/release.yml \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --predicate-type "${predicate}" >/dev/null
          done
      - name: Create and publish the content-addressed Lambda bundle
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
        run: |
          docker pull "${NORMAL_REFERENCE}"
          container=$(docker create "${NORMAL_REFERENCE}")
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir "${RUNNER_TEMP}/lambda-bundle"
          docker cp \
            "${container}:/app/.venv/lib/python3.14/site-packages/." \
            "${RUNNER_TEMP}/lambda-bundle/"
          find "${RUNNER_TEMP}/lambda-bundle" -exec touch -d '1980-01-01T00:00:00Z' {} +
          (
            cd "${RUNNER_TEMP}/lambda-bundle"
            find . -type f -print0 | sort -z | xargs -0 zip -X -q \
              "${RUNNER_TEMP}/shittim-chest-lambda-arm64.zip"
          )
          bundle_sha=$(sha256sum "${RUNNER_TEMP}/shittim-chest-lambda-arm64.zip" | \
            cut -d ' ' -f 1)
          bundle_key="lambda/shittim-chest/${bundle_sha}/shittim-chest-lambda-arm64.zip"
          expected_checksum=$(printf '%s' "${bundle_sha}" | xxd -r -p | base64 -w 0)
          if aws s3api head-object --bucket "${ASSET_BUCKET}" --key "${bundle_key}" \
            --checksum-mode ENABLED > "${RUNNER_TEMP}/lambda-head.json" 2>/dev/null
          then
            test "$(jq --raw-output .ChecksumSHA256 "${RUNNER_TEMP}/lambda-head.json")" = \
              "${expected_checksum}"
          else
            aws s3api put-object \
              --bucket "${ASSET_BUCKET}" \
              --key "${bundle_key}" \
              --body "${RUNNER_TEMP}/shittim-chest-lambda-arm64.zip" \
              --checksum-algorithm SHA256 \
              --if-none-match '*' >/dev/null
          fi
          jq --null-input \
            --arg bucket "${ASSET_BUCKET}" \
            --arg key "${bundle_key}" \
            --arg sha256 "${bundle_sha}" \
            '{bucket:$bucket,key:$key,sha256:$sha256}' \
            > "${RUNNER_TEMP}/lambda-bundle.json"
      - name: Prepare immutable CloudFormation change sets
        id: prepare_changes
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          COST_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_US_EAST_1 }}
          MONITOR_ARN: ${{ vars.EXISTING_SERVICE_ANOMALY_MONITOR_ARN }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_NOTIFICATION_EMAIL }}
          RUNTIME_CONFIG_VERSION: ${{ inputs.runtime_config_version }}
          RUNTIME_TEMPLATE_KEY: ${{ env.RUNTIME_TEMPLATE_KEY }}
          TOKYO_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_TOKYO }}
        run: |
          [[ "${RUNTIME_CONFIG_VERSION}" =~ ^v[0-9]{4}$ ]]
          bundle_key=$(jq --raw-output .key "${RUNNER_TEMP}/lambda-bundle.json")
          bundle_hash=$(jq --raw-output .sha256 "${RUNNER_TEMP}/lambda-bundle.json")
          bundle_code_sha256=$(printf '%s' "${bundle_hash}" | xxd -r -p | base64 -w 0)
          [[ "${bundle_code_sha256}" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          change_set_name="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq --null-input '{}' > "${RUNNER_TEMP}/change-sets.json"
          prepare_change_set() {
            local stack="$1" region="$2" execution_role="$3" artifact
            shift 3
            case "${stack}" in
              ShittimChest-Prod-Stateful) artifact=Stateful ;;
              ShittimChest-Prod-Runtime) artifact=Runtime ;;
              ShittimChest-Prod-Operations) artifact=Operations ;;
              ShittimChest-Prod-CostGovernance) artifact=CostGovernance ;;
              *) exit 1 ;;
            esac
            local type stack_status
            if ! stack_status=$(aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" --query 'Stacks[0].StackStatus' --output text \
              2>"${RUNNER_TEMP}/describe-stack.error")
            then
              grep --fixed-strings '(ValidationError)' \
                "${RUNNER_TEMP}/describe-stack.error" >/dev/null
              grep --fixed-strings 'does not exist' \
                "${RUNNER_TEMP}/describe-stack.error" >/dev/null
              stack_status=""
            fi
            case "${stack_status}" in
              ""|REVIEW_IN_PROGRESS) type=CREATE ;;
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                type=UPDATE
                ;;
              *) exit 1 ;;
            esac
            local arn
            local template_argument template_value
            if [ "${artifact}" = "Runtime" ]; then
              template_argument=--template-url
              template_value="https://${ASSET_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${RUNTIME_TEMPLATE_KEY}"
            else
              template_argument=--template-body
              template_value="file://${RUNNER_TEMP}/cdk.out/${artifact}.template.json"
            fi
            arn=$(aws cloudformation create-change-set \
              --region "${region}" \
              --stack-name "${stack}" \
              --change-set-name "${change_set_name}" \
              --change-set-type "${type}" \
              --description "STEP-10 release ${GITHUB_SHA}" \
              "${template_argument}" "${template_value}" \
              --role-arn "${execution_role}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --client-token "${stack}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$@" \
              --query Id --output text)
            jq --arg stack "${stack}" --arg arn "${arn}" '. + {($stack):$arn}' \
              "${RUNNER_TEMP}/change-sets.json" > "${RUNNER_TEMP}/change-sets.next.json"
            mv "${RUNNER_TEMP}/change-sets.next.json" "${RUNNER_TEMP}/change-sets.json"
            for attempt in $(seq 1 60)
            do
              status=$(aws cloudformation describe-change-set \
                --region "${region}" --change-set-name "${arn}" \
                --query Status --output text)
              if [ "${status}" = "CREATE_COMPLETE" ]; then
                break
              fi
              if [ "${status}" = "FAILED" ]; then
                aws cloudformation describe-change-set \
                  --region "${region}" --change-set-name "${arn}" --output json \
                  > "${RUNNER_TEMP}/${artifact}.failed-change-set.raw.json"
                jq --arg artifact "${artifact}" --arg stack "${stack}" '
                  def scrub:
                    gsub("[0-9]{12}"; "<account>") |
                    gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}";
                      "<redacted-email>") |
                    gsub("https?://[^ ]+"; "<redacted-url>");
                  {
                    schema_version: 1,
                    artifact: $artifact,
                    stack: $stack,
                    status: (.Status // "unknown"),
                    execution_status: (.ExecutionStatus // "unknown"),
                    status_reason: ((.StatusReason // "") | scrub)
                  }
                ' "${RUNNER_TEMP}/${artifact}.failed-change-set.raw.json" \
                  > "${RUNNER_TEMP}/${artifact}.change-set-failure.json"
                rm "${RUNNER_TEMP}/${artifact}.failed-change-set.raw.json"
                jq --compact-output . \
                  "${RUNNER_TEMP}/${artifact}.change-set-failure.json" >&2
                reason=$(jq --raw-output .status_reason \
                  "${RUNNER_TEMP}/${artifact}.change-set-failure.json")
                case "${reason}" in
                  *"didn't contain changes"*) break ;;
                  *) exit 1 ;;
                esac
              fi
              test "${attempt}" -lt 60
              sleep 5
            done
            aws cloudformation describe-change-set \
              --region "${region}" --change-set-name "${arn}" --output json \
              > "${RUNNER_TEMP}/${artifact}.change-set.json"
          }
          prepare_change_set ShittimChest-Prod-Stateful "${AWS_REGION}" \
            "${TOKYO_EXECUTION_ROLE}"
          prepare_change_set ShittimChest-Prod-Runtime "${AWS_REGION}" \
            "${TOKYO_EXECUTION_ROLE}" \
            --parameters \
              "ParameterKey=RuntimeImageDigest,ParameterValue=${NORMAL_DIGEST}" \
              "ParameterKey=RuntimeConfigVersion,ParameterValue=${RUNTIME_CONFIG_VERSION}" \
              "ParameterKey=LambdaBundleBucketName,ParameterValue=${ASSET_BUCKET}" \
              "ParameterKey=LambdaBundleObjectKey,ParameterValue=${bundle_key}" \
              "ParameterKey=LambdaBundleCodeSha256,ParameterValue=${bundle_code_sha256}"
          prepare_change_set ShittimChest-Prod-Operations "${AWS_REGION}" \
            "${TOKYO_EXECUTION_ROLE}" \
            --parameters \
              "ParameterKey=OperatorNotificationEmail,ParameterValue=${OPERATOR_EMAIL}"
          prepare_change_set ShittimChest-Prod-CostGovernance "${COST_REGION}" \
            "${COST_EXECUTION_ROLE}" \
            --parameters \
              "ParameterKey=OperatorNotificationEmail,ParameterValue=${OPERATOR_EMAIL}" \
              "ParameterKey=ExistingServiceAnomalyMonitorArn,ParameterValue=${MONITOR_ARN}"
          validate_change_set() {
            local stack="$1" artifact="$2" arn
            shift 2
            arn=$(jq --raw-output --arg stack "${stack}" '.[$stack]' \
              "${RUNNER_TEMP}/change-sets.json")
            uv run --frozen python tools/release_supply_chain.py validate-change-set \
              "${RUNNER_TEMP}/${artifact}.change-set.json" \
              --expected-arn "${arn}" --expected-stack "${stack}" "$@"
          }
          validate_change_set ShittimChest-Prod-Stateful Stateful
          validate_change_set ShittimChest-Prod-Runtime Runtime \
            --expected-parameter "RuntimeImageDigest=${NORMAL_DIGEST}" \
            --expected-parameter "RuntimeConfigVersion=${RUNTIME_CONFIG_VERSION}" \
            --expected-parameter "LambdaBundleBucketName=${ASSET_BUCKET}" \
            --expected-parameter "LambdaBundleObjectKey=${bundle_key}" \
            --expected-parameter "LambdaBundleCodeSha256=${bundle_code_sha256}"
          validate_change_set ShittimChest-Prod-Operations Operations \
            --expected-noecho-parameter OperatorNotificationEmail
          validate_change_set ShittimChest-Prod-CostGovernance CostGovernance \
            --expected-noecho-parameter OperatorNotificationEmail \
            --expected-parameter "ExistingServiceAnomalyMonitorArn=${MONITOR_ARN}"
      - name: Create the canonical release manifest
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          RUNTIME_CONFIG_VERSION: ${{ inputs.runtime_config_version }}
        run: |
          uv run --frozen python tools/release_supply_chain.py create-manifest \
            --cdk-assets "${RUNNER_TEMP}/cdk-assets.json" \
            --change-sets "${RUNNER_TEMP}/change-sets.json" \
            --commit-sha "${GITHUB_SHA}" \
            --lambda-bundle "${RUNNER_TEMP}/lambda-bundle.json" \
            --normal-sbom "${RUNNER_TEMP}/normal.spdx.json" \
            --normal-config-digest-file "${RUNNER_TEMP}/normal.config-digest" \
            --normal-raw-grype "${RUNNER_TEMP}/normal.raw-grype.json" \
            --normal-vendor-vex "${RUNNER_TEMP}/normal.openvex.json" \
            --normal-verification "${RUNNER_TEMP}/normal.verification.json" \
            --normal-vex-grype "${RUNNER_TEMP}/normal.vex-grype.json" \
            --repository-uri "${ECR_REPOSITORY_URI}" \
            --runtime-config-parameter "/shittim-chest/production/runtime/${RUNTIME_CONFIG_VERSION}" \
            --templates "${RUNNER_TEMP}/template-hashes.json" \
            --output "${RUNNER_TEMP}/release-manifest.json"
      - name: Attest the release manifest
        id: attest_release_manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-manifest.json
          show-summary: false
      - name: Record canonical attestation links
        env:
          NORMAL_PROVENANCE_ID: ${{ steps.attest_normal_provenance.outputs.attestation-id }}
          NORMAL_SBOM_ID: ${{ steps.attest_normal_sbom.outputs.attestation-id }}
          NORMAL_VULNERABILITY_ID: ${{ steps.attest_normal_vulnerability.outputs.attestation-id }}
          RELEASE_MANIFEST_ID: ${{ steps.attest_release_manifest.outputs.attestation-id }}
        run: |
          write_attestation_link() {
            local label="$1"
            local attestation_id="$2"
            if [[ ! "${attestation_id}" =~ ^[0-9]+$ ]]
            then
              echo "Invalid attestation ID for ${label}" >&2
              return 1
            fi
            local display_url="https://github.com/pitek&#117;su/shittim-chest/attestations/${attestation_id}"
            local target_url="https://github.com/pitek%75su/shittim-chest/attestations/${attestation_id}"
            printf '### Attestation Created\n%s: [%s](%s)\n\n' \
              "${label}" "${display_url}" "${target_url}" >> "${GITHUB_STEP_SUMMARY}"
          }
          write_attestation_link "Normal image provenance" "${NORMAL_PROVENANCE_ID}"
          write_attestation_link "Normal image SBOM" "${NORMAL_SBOM_ID}"
          write_attestation_link "Normal image vulnerability assessment" \
            "${NORMAL_VULNERABILITY_ID}"
          write_attestation_link "Release manifest" "${RELEASE_MANIFEST_ID}"
      - name: Record the immutable release evidence name
        id: evidence
        run: |
          echo "artifact_name=production-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "${GITHUB_OUTPUT}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      - name: Retain immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/normal.spdx.json
            ${{ runner.temp }}/normal.*.json
            ${{ runner.temp }}/normal.digest
            ${{ runner.temp }}/normal.config-digest
            ${{ runner.temp }}/cdk.out/Stateful.template.json
            ${{ runner.temp }}/cdk.out/Stateful.assets.json
            ${{ runner.temp }}/cdk.out/Runtime.template.json
            ${{ runner.temp }}/cdk.out/Runtime.assets.json
            ${{ runner.temp }}/cdk.out/Operations.template.json
            ${{ runner.temp }}/cdk.out/Operations.assets.json
            ${{ runner.temp }}/cdk.out/CostGovernance.template.json
            ${{ runner.temp }}/cdk.out/CostGovernance.assets.json
            ${{ runner.temp }}/cdk-assets.json
            ${{ runner.temp }}/change-sets.json
            ${{ runner.temp }}/template-hashes.json
            ${{ runner.temp }}/lambda-bundle.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded Change Set failure evidence
        if: ${{ failure() && steps.prepare_changes.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-plan-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.change-set-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove this failed plan's unexecuted change sets
        if: ${{ always() && steps.plan_aws.outcome == 'success' && contains(fromJSON('["success","failure","cancelled"]'), steps.prepare_changes.outcome) && job.status != 'success' }}
        run: |
          change_set_name="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash tools/cleanup_release_change_sets.sh \
            --change-set-name "${change_set_name}"

  deploy:
    name: deploy
    needs: plan
    if: ${{ needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan_attempt) == github.run_attempt }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked verification environment
        run: uv sync --frozen --all-groups
      - name: Require the immutable production Environment OIDC identity
        run: |
          token_response=$(curl --fail --show-error --silent \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          jwt=$(jq --exit-status --raw-output .value <<< "${token_response}")
          payload="${jwt#*.}"
          payload="${payload%%.*}"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
            0) ;;
            *) exit 1 ;;
          esac
          printf '%s' "${payload}" | tr '_-' '/+' | base64 --decode \
            > "${RUNNER_TEMP}/oidc-claims.json"
          jq --exit-status \
            '.aud == "sts.amazonaws.com" and
             .sub == "repo:pitekusu@12059348/shittim-chest@1302516701:environment:production" and
             .repository_id == "1302516701" and
             .repository_owner_id == "12059348" and
             .environment == "production" and
             .ref == "refs/heads/main"' \
            "${RUNNER_TEMP}/oidc-claims.json" >/dev/null
      - name: Download only this run's release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.evidence_name }}
          path: ${{ runner.temp }}/release
      - name: Revalidate the manifest and its GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="${RUNNER_TEMP}/release/release-manifest.json"
          uv run --frozen python tools/release_supply_chain.py validate-manifest "${manifest}"
          gh attestation verify "${manifest}" \
            --deny-self-hosted-runners \
            --repo pitekusu/shittim-chest \
            --signer-digest "${GITHUB_SHA}" \
            --signer-workflow pitekusu/shittim-chest/.github/workflows/release.yml \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main >/dev/null
          test "$(jq --raw-output .commit_sha "${manifest}")" = "${GITHUB_SHA}"
          check_hash() {
            local path="$1" expected="$2"
            test "$(sha256sum "${path}" | cut -d ' ' -f 1)" = "${expected}"
          }
          check_hash "${RUNNER_TEMP}/release/normal.spdx.json" \
            "$(jq --raw-output '.images.normal.sbom.sha256' "${manifest}")"
          check_hash "${RUNNER_TEMP}/release/normal.raw-grype.json" \
            "$(jq --raw-output '.images.normal.risk_evidence.grype_raw' "${manifest}")"
          check_hash "${RUNNER_TEMP}/release/normal.vex-grype.json" \
            "$(jq --raw-output '.images.normal.risk_evidence.grype_vex' "${manifest}")"
          check_hash "${RUNNER_TEMP}/release/normal.openvex.json" \
            "$(jq --raw-output '.images.normal.risk_evidence.vendor_vex' "${manifest}")"
          uv run --frozen python tools/check_container_risk_acceptance.py \
            --policy security/container-risk-acceptance.json \
            --raw-report "${RUNNER_TEMP}/release/normal.raw-grype.json" \
            --vex-report "${RUNNER_TEMP}/release/normal.vex-grype.json" \
            --image-kind production \
            --image-config-digest-file "${RUNNER_TEMP}/release/normal.config-digest"
          test "$(cat "${RUNNER_TEMP}/release/normal.config-digest")" = \
            "$(jq --raw-output '.images.normal.config_digest' "${manifest}")"
          for mapping in \
            'ShittimChest-Prod-Stateful=Stateful' \
            'ShittimChest-Prod-Runtime=Runtime' \
            'ShittimChest-Prod-Operations=Operations' \
            'ShittimChest-Prod-CostGovernance=CostGovernance'
          do
            stack="${mapping%%=*}"
            artifact="${mapping#*=}"
            check_hash "${RUNNER_TEMP}/release/cdk.out/${artifact}.template.json" \
              "$(jq --raw-output --arg stack "${stack}" '.templates[$stack]' "${manifest}")"
          done
          jq --exit-status --slurpfile actual "${RUNNER_TEMP}/release/change-sets.json" \
            '.change_sets == $actual[0]' "${manifest}" >/dev/null
          jq --exit-status --slurpfile actual "${RUNNER_TEMP}/release/lambda-bundle.json" \
            '.lambda_bundle == $actual[0]' "${manifest}" >/dev/null
          jq --exit-status --slurpfile actual "${RUNNER_TEMP}/release/cdk-assets.json" \
            '.cdk_assets == $actual[0]' "${manifest}" >/dev/null
          repository_uri=$(jq --raw-output .images.normal.repository_uri "${manifest}")
          account="${repository_uri%%.*}"
          uv run --frozen python tools/release_supply_chain.py validate-cdk-assets \
            "${RUNNER_TEMP}/release/cdk-assets.json" \
            --account "${account}" \
            --assembly "${RUNNER_TEMP}/release/cdk.out"
      - name: Acquire deploy-only AWS credentials
        id: deploy_aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: release-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Bind deploy handles to the approved production account
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_RELEASE_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "${account}" =~ ^[0-9]{12}$ ]]
          test "${DEPLOY_ROLE_ARN}" = \
            "arn:aws:iam::${account}:role/ShittimChest-Prod-GitHub-ReleaseDeploy"
          test "${ASSET_BUCKET}" = "cdk-hnb659fds-assets-${account}-${AWS_REGION}"
          test "${ECR_REPOSITORY_URI}" = \
            "${account}.dkr.ecr.${AWS_REGION}.amazonaws.com/shittim-chest"
          test "${TABLE_NAME}" = "shittim-chest-production"
          manifest="${RUNNER_TEMP}/release/release-manifest.json"
          bundle_bucket=$(jq --raw-output .lambda_bundle.bucket "${manifest}")
          bundle_key=$(jq --raw-output .lambda_bundle.key "${manifest}")
          bundle_hash=$(jq --raw-output .lambda_bundle.sha256 "${manifest}")
          test "${bundle_bucket}" = "${ASSET_BUCKET}"
          aws s3api head-object --bucket "${bundle_bucket}" --key "${bundle_key}" \
            --checksum-mode ENABLED > "${RUNNER_TEMP}/bundle-head.json"
          expected_checksum=$(printf '%s' "${bundle_hash}" | xxd -r -p | base64 -w 0)
          test "$(jq --raw-output .ChecksumSHA256 "${RUNNER_TEMP}/bundle-head.json")" = \
            "${expected_checksum}"
          uv run --frozen python tools/release_supply_chain.py validate-cdk-assets \
            "${RUNNER_TEMP}/release/cdk-assets.json" \
            --account "${account}" \
            --assembly "${RUNNER_TEMP}/release/cdk.out"
          while IFS= read -r asset
          do
            region=$(jq --raw-output .region <<< "${asset}")
            bucket=$(jq --raw-output .bucket <<< "${asset}")
            object_key=$(jq --raw-output .object_key <<< "${asset}")
            expected_checksum=$(jq --raw-output .s3_checksum_sha256 <<< "${asset}")
            aws s3api head-object --region "${region}" \
              --bucket "${bucket}" --key "${object_key}" --checksum-mode ENABLED \
              > "${RUNNER_TEMP}/cdk-asset-head.json"
            test "$(jq --raw-output .ChecksumSHA256 \
              "${RUNNER_TEMP}/cdk-asset-head.json")" = "${expected_checksum}"
          done < <(jq --compact-output '.files[]' \
            "${RUNNER_TEMP}/release/cdk-assets.json")
          uv run --frozen python -m tools.control_records validate-compatible \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" >/dev/null
          uv run --frozen python -m tools.control_records guard \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --commit-sha "${GITHUB_SHA}" \
            --actor "${GITHUB_TRIGGERING_ACTOR}" \
            --run-id "${GITHUB_RUN_ID}" \
            --environment production \
            --audit-output "${RUNNER_TEMP}/release/deploy-preflight-audit.json" >/dev/null
      - name: Reinstall the pinned Notation verifier
        run: bash tools/install_aws_signer_notation.sh
      - name: Authenticate the OCI clients to ECR
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login \
            --username AWS --password-stdin "${registry}"
      - name: Reinstall and configure the pinned ECR credential helper
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          registry="${ECR_REPOSITORY_URI%%/*}"
          bash tools/install_ecr_credential_helper.sh "${registry}"
      - name: Cryptographically reverify the image identity
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
        run: |
          manifest="${RUNNER_TEMP}/release/release-manifest.json"
          jq --null-input \
            --arg repository "${ECR_REPOSITORY_URI}" \
            --arg profile "${SIGNING_PROFILE_ARN}" \
            '{version:"1.0",trustPolicies:[{name:"shittim-chest-release",registryScopes:[$repository],signatureVerification:{level:"strict"},trustStores:["signingAuthority:aws-signer-ts"],trustedIdentities:[$profile]}]}' \
            > "${RUNNER_TEMP}/notation-trust-policy.json"
          notation policy import --force "${RUNNER_TEMP}/notation-trust-policy.json"
          reference=$(jq --raw-output '.images.normal.reference' "${manifest}")
          notation verify "${reference}"
          notation inspect --output json "${reference}" \
            > "${RUNNER_TEMP}/normal.notation.json"
          for predicate in \
            https://slsa.dev/provenance/v1 \
            https://spdx.dev/Document/v2.3 \
            https://github.com/pitekusu/shittim-chest/attestations/vulnerability-assessment/v1
          do
            gh attestation verify "oci://${reference}" \
              --bundle-from-oci \
              --deny-self-hosted-runners \
              --repo pitekusu/shittim-chest \
              --signer-digest "${GITHUB_SHA}" \
              --signer-workflow pitekusu/shittim-chest/.github/workflows/release.yml \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --predicate-type "${predicate}" >/dev/null
          done
      - name: Reverify AWS evidence and immutable change sets
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          MONITOR_ARN: ${{ vars.EXISTING_SERVICE_ANOMALY_MONITOR_ARN }}
          SIGNING_PROFILE_ARN: ${{ vars.ECR_SIGNING_PROFILE_ARN }}
        run: |
          manifest="${RUNNER_TEMP}/release/release-manifest.json"
          repository="${ECR_REPOSITORY_URI##*/}"
          coverage_filter=$(jq --compact-output --null-input --arg repository "${repository}" \
            '{ecrRepositoryName:[{comparison:"EQUALS",value:$repository}]}')
          digest=$(jq --raw-output '.images.normal.digest' "${manifest}")
          aws ecr describe-images \
            --repository-name "${repository}" --image-ids "imageDigest=${digest}" \
            --output json > "${RUNNER_TEMP}/normal.image.json"
          aws ecr describe-image-signing-status \
            --repository-name "${repository}" --image-id "imageDigest=${digest}" \
            --output json > "${RUNNER_TEMP}/normal.signing.json"
          aws ecr describe-image-scan-findings \
            --repository-name "${repository}" --image-id "imageDigest=${digest}" \
            --output json > "${RUNNER_TEMP}/normal.scan.json"
          aws inspector2 list-coverage \
            --filter-criteria "${coverage_filter}" \
            --output json > "${RUNNER_TEMP}/normal.coverage.json"
          aws ecr list-image-referrers \
            --repository-name "${repository}" --subject-id "imageDigest=${digest}" \
            --output json > "${RUNNER_TEMP}/normal.referrers-current.json"
          uv run --frozen python tools/release_supply_chain.py \
            select-release-referrers \
            --before-referrers "${RUNNER_TEMP}/release/normal.referrers-before.json" \
            --after-referrers "${RUNNER_TEMP}/normal.referrers-current.json" \
            --notation-inspection "${RUNNER_TEMP}/normal.notation.json" \
            --profile-arn "${SIGNING_PROFILE_ARN}" \
            --output "${RUNNER_TEMP}/normal.referrers.json"
          uv run --frozen python tools/release_supply_chain.py verify-image \
            --digest "${digest}" --coverage "${RUNNER_TEMP}/normal.coverage.json" \
            --profile-arn "${SIGNING_PROFILE_ARN}" \
            --image-details "${RUNNER_TEMP}/normal.image.json" \
            --signing-status "${RUNNER_TEMP}/normal.signing.json" \
            --referrers "${RUNNER_TEMP}/normal.referrers.json" \
            --scan "${RUNNER_TEMP}/normal.scan.json" --risk-gate-passed \
            --output "${RUNNER_TEMP}/normal.verification.json"
          jq --exit-status \
            --slurpfile actual "${RUNNER_TEMP}/normal.verification.json" \
            '.images.normal.digest == $actual[0].image_digest and
             .images.normal.media_type == $actual[0].media_type and
             .images.normal.referrers == $actual[0].referrers and
             (.images.normal.scan | del(.scanned_at)) ==
               ($actual[0].scan | del(.scanned_at)) and
             .images.normal.signing_profile_arn == $actual[0].signing_profile_arn' \
            "${manifest}" >/dev/null
          runtime_config=$(jq --raw-output .runtime_config_parameter "${manifest}")
          runtime_config="${runtime_config##*/}"
          normal_digest=$(jq --raw-output .images.normal.digest "${manifest}")
          bundle_key=$(jq --raw-output .lambda_bundle.key "${manifest}")
          bundle_hash=$(jq --raw-output .lambda_bundle.sha256 "${manifest}")
          bundle_code_sha256=$(printf '%s' "${bundle_hash}" | xxd -r -p | base64 -w 0)
          [[ "${bundle_code_sha256}" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          validate_change_set() {
            local stack="$1" region="$2" artifact="$3" arn
            shift 3
            arn=$(jq --raw-output --arg stack "${stack}" '.change_sets[$stack]' "${manifest}")
            aws cloudformation describe-change-set --region "${region}" \
              --change-set-name "${arn}" --output json \
              > "${RUNNER_TEMP}/${artifact}.change-set.json"
            uv run --frozen python tools/release_supply_chain.py validate-change-set \
              "${RUNNER_TEMP}/${artifact}.change-set.json" \
              --expected-arn "${arn}" --expected-stack "${stack}" "$@"
          }
          validate_change_set ShittimChest-Prod-Stateful "${AWS_REGION}" Stateful
          validate_change_set ShittimChest-Prod-Runtime "${AWS_REGION}" Runtime \
            --expected-parameter "RuntimeImageDigest=${normal_digest}" \
            --expected-parameter "RuntimeConfigVersion=${runtime_config}" \
            --expected-parameter "LambdaBundleBucketName=${ASSET_BUCKET}" \
            --expected-parameter "LambdaBundleObjectKey=${bundle_key}" \
            --expected-parameter "LambdaBundleCodeSha256=${bundle_code_sha256}"
          validate_change_set ShittimChest-Prod-Operations "${AWS_REGION}" Operations \
            --expected-noecho-parameter OperatorNotificationEmail
          validate_change_set ShittimChest-Prod-CostGovernance "${COST_REGION}" \
            CostGovernance \
            --expected-noecho-parameter OperatorNotificationEmail \
            --expected-parameter "ExistingServiceAnomalyMonitorArn=${MONITOR_ARN}"
          for mapping in \
            'ShittimChest-Prod-Stateful=Stateful' \
            'ShittimChest-Prod-Runtime=Runtime' \
            'ShittimChest-Prod-Operations=Operations' \
            'ShittimChest-Prod-CostGovernance=CostGovernance'
          do
            stack="${mapping%%=*}"
            artifact="${mapping#*=}"
            template_hash=$(sha256sum \
              "${RUNNER_TEMP}/release/cdk.out/${artifact}.template.json" | cut -d ' ' -f 1)
            test "${template_hash}" = \
              "$(jq --raw-output --arg stack "${stack}" '.templates[$stack]' "${manifest}")"
          done
      - name: Acquire the fenced production deployment lock
        id: acquire
        env:
          TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: |
          guard_id=$(uv run --frozen python -c 'import uuid; print(uuid.uuid7())')
          uv run --frozen python -m tools.control_records acquire \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --commit-sha "${GITHUB_SHA}" \
            --actor "${GITHUB_TRIGGERING_ACTOR}" \
            --run-id "${GITHUB_RUN_ID}" \
            --environment production \
            --guard-id "${guard_id}" \
            --lock-seconds 3600 \
            --acknowledge-write acquire-deployment-lock \
            --audit-output "${RUNNER_TEMP}/release/deploy-lock-audit.json"
          fencing_token=$(jq --raw-output .lock_fencing_token \
            "${RUNNER_TEMP}/release/deploy-lock-audit.json")
          control_schema_before=$(jq --raw-output .control_schema_before \
            "${RUNNER_TEMP}/release/deploy-lock-audit.json")
          control_schema_after=$(jq --raw-output .control_schema_after \
            "${RUNNER_TEMP}/release/deploy-lock-audit.json")
          control_schema_migrated=$(jq --raw-output .control_schema_migrated \
            "${RUNNER_TEMP}/release/deploy-lock-audit.json")
          {
            echo "acquired=true"
            echo "guard_id=${guard_id}"
            echo "fencing_token=${fencing_token}"
            echo "control_schema_before=${control_schema_before}"
            echo "control_schema_after=${control_schema_after}"
            echo "control_schema_migrated=${control_schema_migrated}"
          } >> "${GITHUB_OUTPUT}"
      - name: Execute only the attested change sets
        env:
          MANIFEST: ${{ runner.temp }}/release/release-manifest.json
        run: |
          deploy_stack() {
            local stack="$1" region="$2" arn status stack_status create_stack=false
            arn=$(jq --raw-output --arg stack "${stack}" '.change_sets[$stack]' "${MANIFEST}")
            status=$(aws cloudformation describe-change-set --region "${region}" \
              --change-set-name "${arn}" --query Status --output text)
            if [ "${status}" = "FAILED" ]; then
              return 0
            fi
            test "${status}" = "CREATE_COMPLETE"
            stack_status=$(aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" --query 'Stacks[0].StackStatus' --output text)
            case "${stack_status}" in
              REVIEW_IN_PROGRESS) create_stack=true ;;
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              *) exit 1 ;;
            esac
            aws cloudformation execute-change-set --region "${region}" \
              --change-set-name "${arn}"
            if [ "${create_stack}" = true ]; then
              aws cloudformation wait stack-create-complete --region "${region}" \
                --stack-name "${stack}"
            else
              aws cloudformation wait stack-update-complete --region "${region}" \
                --stack-name "${stack}"
            fi
          }
          deploy_stack ShittimChest-Prod-Stateful "${AWS_REGION}"
          deploy_stack ShittimChest-Prod-Runtime "${AWS_REGION}"
          deploy_stack ShittimChest-Prod-Operations "${AWS_REGION}"
          deploy_stack ShittimChest-Prod-CostGovernance "${COST_REGION}"
      - name: Run content-free post-deploy structural smoke checks
        run: |
          service=$(aws ecs describe-services \
            --cluster shittim-chest-production \
            --services shittim-chest-production --output json)
          jq --exit-status \
            '(.failures == []) and (.services | length == 1) and
             (.services[0].desiredCount <= 1) and (.services[0].runningCount <= 1)' \
            <<< "${service}" >/dev/null
          task_definition=$(jq --raw-output '.services[0].taskDefinition' <<< "${service}")
          aws ecs describe-task-definition --task-definition "${task_definition}" \
            --output json > "${RUNNER_TEMP}/deployed-task-definition.json"
          expected_image=$(jq --raw-output .images.normal.reference \
            "${RUNNER_TEMP}/release/release-manifest.json")
          jq --exit-status --arg expected "${expected_image}" \
            '[.taskDefinition.containerDefinitions[] |
              select(.name == "application") | .image] == [$expected]' \
            "${RUNNER_TEMP}/deployed-task-definition.json" >/dev/null
          aws lambda get-function-configuration \
            --function-name shittim-chest-production-image-admission \
            --query '[State,LastUpdateStatus]' --output text | \
            grep --fixed-strings $'Active\tSuccessful'
      - name: Capture bounded CloudFormation failure diagnostics
        id: failure_diagnostics
        if: failure() && steps.acquire.outputs.acquired == 'true'
        continue-on-error: true
        run: |
          jq --null-input '{}' > "${RUNNER_TEMP}/release/deployment-failure-events.json"
          for mapping in \
            'ShittimChest-Prod-Stateful=ap-northeast-1' \
            'ShittimChest-Prod-Runtime=ap-northeast-1' \
            'ShittimChest-Prod-Operations=ap-northeast-1' \
            'ShittimChest-Prod-CostGovernance=us-east-1'
          do
            stack="${mapping%%=*}"
            region="${mapping#*=}"
            aws cloudformation describe-events --region "${region}" \
              --stack-name "${stack}" --filters FailedEvents=true \
              --max-items 100 \
              --query 'OperationEvents[].{EventType:EventType,LogicalResourceId:LogicalResourceId,OperationId:OperationId,OperationStatus:OperationStatus,OperationType:OperationType,ResourceStatus:ResourceStatus,ResourceStatusReason:ResourceStatusReason,ResourceType:ResourceType}' \
              --output json > "${RUNNER_TEMP}/failed-events.json"
            jq --arg stack "${stack}" \
              --slurpfile events "${RUNNER_TEMP}/failed-events.json" \
              '. + {($stack): ($events[0] | map(
                .ResourceStatusReason = ((.ResourceStatusReason // "") |
                  gsub("[0-9]{12}"; "<account>") |
                  gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}";
                    "<redacted-email>") |
                  gsub("https?://[^ ]+"; "<redacted-url>"))
              ))}' "${RUNNER_TEMP}/release/deployment-failure-events.json" \
              > "${RUNNER_TEMP}/release/deployment-failure-events.next.json"
            mv "${RUNNER_TEMP}/release/deployment-failure-events.next.json" \
              "${RUNNER_TEMP}/release/deployment-failure-events.json"
          done
      - name: Remove this release's unexecuted change sets
        if: always() && steps.deploy_aws.outcome == 'success'
        run: |
          bash tools/cleanup_release_change_sets.sh \
            --manifest "${RUNNER_TEMP}/release/release-manifest.json"
      - name: Release the exact deployment fence
        if: always() && steps.acquire.outputs.acquired == 'true'
        env:
          FENCING_TOKEN: ${{ steps.acquire.outputs.fencing_token }}
          GUARD_ID: ${{ steps.acquire.outputs.guard_id }}
          CONTROL_SCHEMA_BEFORE: ${{ steps.acquire.outputs.control_schema_before }}
          CONTROL_SCHEMA_AFTER: ${{ steps.acquire.outputs.control_schema_after }}
          CONTROL_SCHEMA_MIGRATED: ${{ steps.acquire.outputs.control_schema_migrated }}
          TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: |
          rollback=false
          runtime_candidate_active=false
          runtime_stack_status=not-checked
          release_args=()
          if [ "${CONTROL_SCHEMA_MIGRATED}" = true ]; then
            runtime_stack_status=$(aws cloudformation describe-stacks \
              --region "${AWS_REGION}" \
              --stack-name ShittimChest-Prod-Runtime \
              --query 'Stacks[0].StackStatus' --output text)
            service=$(aws ecs describe-services \
              --cluster shittim-chest-production \
              --services shittim-chest-production --output json)
            jq --exit-status \
              '(.failures == []) and (.services | length == 1)' \
              <<< "${service}" >/dev/null
            task_definition=$(jq --raw-output '.services[0].taskDefinition' <<< "${service}")
            deployed_image=$(aws ecs describe-task-definition \
              --task-definition "${task_definition}" \
              --query 'taskDefinition.containerDefinitions[?name==`application`].image | [0]' \
              --output text)
            expected_image=$(jq --raw-output .images.normal.reference \
              "${RUNNER_TEMP}/release/release-manifest.json")
            if [ "${deployed_image}" = "${expected_image}" ]; then
              runtime_candidate_active=true
            fi
          elif [ "${CONTROL_SCHEMA_MIGRATED}" != false ]; then
            echo "Control schema migration evidence is invalid" >&2
            exit 1
          fi
          if ! uv run --frozen python -m tools.control_records release-decision \
            --control-schema-before "${CONTROL_SCHEMA_BEFORE}" \
            --control-schema-after "${CONTROL_SCHEMA_AFTER}" \
            --control-schema-migrated "${CONTROL_SCHEMA_MIGRATED}" \
            --runtime-stack-status "${runtime_stack_status}" \
            --runtime-candidate-active "${runtime_candidate_active}" \
            --audit-output "${RUNNER_TEMP}/release/control-schema-release.json"
          then
            echo "Runtime deployment state is ambiguous; retaining the deployment fence" >&2
            exit 1
          fi
          rollback=$(jq --raw-output .rollback_requested \
            "${RUNNER_TEMP}/release/control-schema-release.json")
          if [ "${rollback}" = true ]; then
            release_args+=(--rollback-control-schema)
          elif [ "${rollback}" != false ]; then
            exit 1
          fi
          uv run --frozen python -m tools.control_records release \
            --table-name "${TABLE_NAME}" \
            --region "${AWS_REGION}" \
            --guard-id "${GUARD_ID}" \
            --fencing-token "${FENCING_TOKEN}" \
            --actor "${GITHUB_TRIGGERING_ACTOR}" \
            "${release_args[@]}" \
            --acknowledge-write release-deployment-lock
          jq '.lock_released = true' \
            "${RUNNER_TEMP}/release/control-schema-release.json" \
            > "${RUNNER_TEMP}/release/control-schema-release.next.json"
          mv "${RUNNER_TEMP}/release/control-schema-release.next.json" \
            "${RUNNER_TEMP}/release/control-schema-release.json"
      - name: Retain deployment lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release/deploy-preflight-audit.json
            ${{ runner.temp }}/release/deploy-lock-audit.json
            ${{ runner.temp }}/release/control-schema-release.json
            ${{ runner.temp }}/release/deployment-failure-events.json
          if-no-files-found: warn
          retention-days: 90

  cleanup:
    name: cleanup
    needs: [plan, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release cleanup implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the exact planned release evidence for cleanup
        id: cleanup_evidence
        if: ${{ needs.plan.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.evidence_name }}
          path: ${{ runner.temp }}/release-cleanup
      - name: Acquire plan-role cleanup credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: release-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Confirm this release has no unexecuted change sets
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVIDENCE_RESULT: ${{ steps.cleanup_evidence.outcome }}
          PLAN_ATTEMPT: ${{ needs.plan.outputs.plan_attempt }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          if [ "${PLAN_RESULT}" = success ] && [[ ! "${PLAN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          then
            echo "::error::Successful release plan returned an invalid attempt identity." >&2
            exit 1
          fi
          if [ "${PLAN_RESULT}" = success ] && [ "${EVIDENCE_RESULT}" = success ]
          then
            manifest="${RUNNER_TEMP}/release-cleanup/release-manifest.json"
            bash tools/cleanup_release_change_sets.sh --manifest "${manifest}"
          else
            if [ "${PLAN_RESULT}" = success ]
            then
              change_set_name="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${PLAN_ATTEMPT}"
              bash tools/cleanup_release_change_sets.sh \
                --attempt-name "${change_set_name}"
            else
              change_set_name="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              bash tools/cleanup_release_change_sets.sh \
                --change-set-name "${change_set_name}"
            fi
            if [ "${PLAN_RESULT}" = success ]
            then
              echo "::error::Release evidence download failed. Exact current change sets were cleaned; use Re-run all jobs." >&2
            else
              echo "::error::Release planning did not succeed. Partial change sets were cleaned; use Re-run all jobs." >&2
            fi
            exit 1
          fi
          if [ "${PLAN_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]
          then
            echo "::error::A failed-jobs-only rerun cannot reuse an earlier release plan. Use Re-run all jobs." >&2
            exit 1
          fi
          if [ "${DEPLOY_RESULT}" != success ]
          then
            echo "::error::Deployment did not succeed. Change sets were cleaned; use Re-run all jobs." >&2
            exit 1
          fi
