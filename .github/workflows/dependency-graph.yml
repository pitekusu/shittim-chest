name: Dependency Graph

on:
  push:
    branches:
      - main
    paths:
      - "apps/records-android/**"
      - ".github/workflows/dependency-graph.yml"
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  PYTHON_VERSION: "3.14.10"
  UV_VERSION: "0.13.6"

jobs:
  submit-android-dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install the pinned Android JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: apps/records-android/.java-version
      - name: Select the filtered JDK trust store
        run: >-
          python3 -m tools.configure_build_tls --java
          --output "${RUNNER_TEMP}/shittim-tls" --github-env "${GITHUB_ENV}"
      - name: Install the compile SDK and build tools
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'
      - name: Resolve and submit Android dependencies for Dependabot alerts
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: apps/records-android
          dependency-graph: generate-and-submit
          additional-arguments: --no-daemon
          cache-read-only: true

  verify-managed-sbom:
    name: verify-managed-sbom
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups
      - name: Generate the tested source SBOM
        run: |
          uv export --quiet --frozen --all-groups --format cyclonedx1.5 \
            --output-file "${RUNNER_TEMP}/source-sbom.cdx.json"
          uv export --quiet --frozen --all-groups --project services/records \
            --format cyclonedx1.5 --output-file "${RUNNER_TEMP}/records-sbom.cdx.json"
          uv export --quiet --frozen --all-groups --project apps/records-web/scripts/fonts \
            --format cyclonedx1.5 --output-file "${RUNNER_TEMP}/fonts-sbom.cdx.json"
      - name: Wait for and compare the GitHub-managed SPDX SBOM
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "${main_sha}" != "${GITHUB_SHA}" ]; then
            printf 'main advanced from %s to %s; rerun against the new main\n' \
              "${GITHUB_SHA}" "${main_sha}"
            exit 1
          fi
          for attempt in {1..5}; do
            printf 'Comparing Core, Records, and Web font Python inventories (attempt %s/5)\n' "${attempt}"
            timeout 60s gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" \
              > "${RUNNER_TEMP}/github-sbom.spdx.json"
            comparison=1
            if uv run --frozen python tools/check_sbom.py compare-github \
              "${RUNNER_TEMP}/source-sbom.cdx.json" \
              "${RUNNER_TEMP}/github-sbom.spdx.json" \
              --additional-source "${RUNNER_TEMP}/records-sbom.cdx.json" \
              services/records/uv.lock services/records/pyproject.toml \
              --additional-source "${RUNNER_TEMP}/fonts-sbom.cdx.json" \
              apps/records-web/scripts/fonts/uv.lock \
              apps/records-web/scripts/fonts/pyproject.toml; then
              comparison=0
            fi
            main_sha=$(timeout 15s gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            if [ "${main_sha}" != "${GITHUB_SHA}" ]; then
              printf 'main advanced from %s to %s; discard this comparison and rerun\n' \
                "${GITHUB_SHA}" "${main_sha}"
              exit 1
            fi
            if [ "${comparison}" -eq 0 ]; then
              exit 0
            fi
            if [ "${attempt}" -eq 5 ]; then
              printf 'managed Dependency Graph did not converge after %s attempts\n' "${attempt}" >&2
              exit 1
            fi
            sleep 60
          done
      - name: Retain both SBOM representations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-graph-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-sbom.cdx.json
            ${{ runner.temp }}/records-sbom.cdx.json
            ${{ runner.temp }}/fonts-sbom.cdx.json
            ${{ runner.temp }}/github-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
