name: Records Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-runを先に実行し、承認後だけapplyを選択する"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      page_limit:
        description: "1回にScanするsource item上限"
        required: true
        default: "100"
        type: string

permissions: {}

concurrency:
  group: records-backfill
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  AWS_REGION: ap-northeast-1
  BACKFILL_MAX_PAGES: "25"

jobs:
  backfill:
    name: backfill
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require immutable main inputs
        env:
          MODE: ${{ inputs.mode }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = pitekusu/shittim-chest
          test "${GITHUB_REPOSITORY_ID}" = "1302516701"
          test "${MODE}" = dry-run || test "${MODE}" = apply
          [[ "${PAGE_LIMIT}" =~ ^[0-9]+$ ]]
          test "${PAGE_LIMIT}" -ge 1
          test "${PAGE_LIMIT}" -le 100
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the invoked main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Acquire Records backfill credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RECORDS_BACKFILL_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: records-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Invoke bounded content-free Backfill pages to completion
        env:
          MODE: ${{ inputs.mode }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
        run: |
          jq --null-input --arg mode "${MODE}" --argjson page_limit "${PAGE_LIMIT}" \
            '{mode:$mode,page_limit:$page_limit}' > "${RUNNER_TEMP}/payload.json"
          aws lambda get-function-configuration \
            --function-name shittim-chest-production-records-backfill \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus}' \
            > "${RUNNER_TEMP}/function.json"
          jq --exit-status \
            '.State == "Active" and .LastUpdateStatus == "Successful"' \
            "${RUNNER_TEMP}/function.json" >/dev/null
          complete=false
          for ((page = 1; page <= BACKFILL_MAX_PAGES; page++)); do
            aws lambda invoke \
              --function-name shittim-chest-production-records-backfill \
              --cli-binary-format raw-in-base64-out \
              --payload "fileb://${RUNNER_TEMP}/payload.json" \
              "${RUNNER_TEMP}/response.json" > "${RUNNER_TEMP}/invoke.json"
            jq --exit-status '.FunctionError == null' "${RUNNER_TEMP}/invoke.json" >/dev/null
            jq --exit-status --arg mode "${MODE}" \
              'keys == ["candidates","complete","mode","projected","skipped","validated"] and
               .mode == $mode and
               (.candidates|type) == "number" and
               (.validated|type) == "number" and
               (.projected|type) == "number" and
               (.skipped|type) == "number" and
               .validated == .candidates and
               (.complete|type) == "boolean"' \
              "${RUNNER_TEMP}/response.json" >/dev/null
            complete="$(jq --raw-output '.complete' "${RUNNER_TEMP}/response.json")"
            if [ "${complete}" = true ]; then
              break
            fi
          done
          test "${complete}" = true
          jq '{mode,candidates,validated,projected,skipped,complete}' \
            "${RUNNER_TEMP}/response.json" >> "${GITHUB_STEP_SUMMARY}"
