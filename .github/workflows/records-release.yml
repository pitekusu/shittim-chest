name: Records Release

on:
  workflow_dispatch:
    inputs:
      source_stream_arn:
        description: "M1で有効化済みのDebateTable Stream ARN"
        required: true
        type: string

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.14.6"
  UV_VERSION: "0.11.29"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.evidence.outputs.artifact_name }}
    permissions:
      attestations: write
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Require the immutable main branch
        env:
          EXPECTED_REPOSITORY: pitekusu/shittim-chest
          EXPECTED_REPOSITORY_ID: "1302516701"
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REPOSITORY_ID}" = "${EXPECTED_REPOSITORY_ID}"
          test "${GITHUB_SHA}" = "${GITHUB_WORKFLOW_SHA}"
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful main Records and CodeQL gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/checks.json"
          for check in \
            records-gate \
            'Analyze (python)' \
            'Analyze (javascript-typescript)' \
            'Analyze (actions)'
          do
            jq --exit-status --arg check "${check}" \
              '[.[].check_runs[]] | map(select(.name == $check)) | sort_by(.id) | last |
               .conclusion == "success"' \
              "${RUNNER_TEMP}/checks.json" >/dev/null
          done
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frozen build environments
        run: |
          uv sync --project services/records --frozen --all-groups
          npm ci --ignore-scripts
          (
            cd apps/records-web
            corepack enable pnpm
            test "$(pnpm --version)" = "11.21.0"
            pnpm install --frozen-lockfile
          )
      - name: Re-run Records release-critical gates
        run: |
          (
            cd services/records
            uv run --frozen ruff format --check .
            uv run --frozen ruff check .
            uv run --frozen ty check
            uv run --frozen pytest
          )
          npm run build
          npx vitest run \
            infra/test/records-stateful-stack.test.ts \
            infra/test/records-application-stack.test.ts \
            infra/test/records-edge-stack.test.ts \
            --testTimeout=15000
          pnpm --dir apps/records-web exec vp check
          pnpm --dir apps/records-web exec vp test
          pnpm --dir apps/records-web exec vp build
          pnpm --dir apps/records-web audit --audit-level=low
      - name: Build deterministic Records Lambda bundle and SBOM
        id: bundle
        run: |
          stage="${RUNNER_TEMP}/records-lambda"
          wheels="${RUNNER_TEMP}/records-wheels"
          mkdir -p "${stage}" "${wheels}"
          uv export --project services/records --frozen --no-dev --no-emit-local \
            --no-annotate --output-file "${RUNNER_TEMP}/records-runtime.txt"
          uv pip install --require-hashes --target "${stage}" \
            --requirements "${RUNNER_TEMP}/records-runtime.txt"
          uv build --wheel --out-dir "${wheels}"
          uv build --project services/records --wheel --out-dir "${wheels}"
          uv pip install --no-deps --target "${stage}" "${wheels}"/*.whl
          uv export --project services/records --frozen --no-dev \
            --format cyclonedx1.5 --output-file "${RUNNER_TEMP}/records-sbom.cdx.json"
          uv run --frozen python tools/build_records_bundle.py \
            --source "${stage}" --output "${RUNNER_TEMP}/records-lambda.zip"
          bundle_hash=$(sha256sum "${RUNNER_TEMP}/records-lambda.zip" | cut -d' ' -f1)
          bundle_code_sha256=$(openssl dgst -sha256 -binary \
            "${RUNNER_TEMP}/records-lambda.zip" | base64 -w0)
          test "$(printf '%s' "${bundle_code_sha256}" | wc -c)" -eq 44
          echo "bundle_hash=${bundle_hash}" >> "${GITHUB_OUTPUT}"
          echo "bundle_code_sha256=${bundle_code_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Build the deterministic Records Web artifact
        id: web
        run: |
          uv run --frozen python tools/build_records_web_artifact.py \
            --source apps/records-web/dist \
            --output "${RUNNER_TEMP}/records-web.zip"
          web_hash=$(sha256sum "${RUNNER_TEMP}/records-web.zip" | cut -d' ' -f1)
          echo "web_hash=${web_hash}" >> "${GITHUB_OUTPUT}"
      - name: Generate the pinned Records Web SBOM
        id: web_sbom
        run: |
          version=$(jq --raw-output '.tools.syft.version' .github/tool-versions.json)
          archive_name=$(jq --raw-output '.tools.syft.archive_name' .github/tool-versions.json)
          archive_sha=$(jq --raw-output '.tools.syft.archive_sha256' .github/tool-versions.json)
          archive="${RUNNER_TEMP}/${archive_name}"
          curl --fail --location --proto '=https' --show-error --silent --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/anchore/syft/releases/download/v${version}/${archive_name}"
          printf '%s  %s\n' "${archive_sha}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" syft
          test "$("${RUNNER_TEMP}/syft" version -o json | jq --raw-output .version)" = \
            "${version}"
          "${RUNNER_TEMP}/syft" "dir:apps/records-web" \
            --output "cyclonedx-json=${RUNNER_TEMP}/records-web-sbom.cdx.json"
          web_sbom_hash=$(sha256sum "${RUNNER_TEMP}/records-web-sbom.cdx.json" \
            | cut -d' ' -f1)
          echo "web_sbom_hash=${web_sbom_hash}" >> "${GITHUB_OUTPUT}"
      - name: Validate Records plan handles
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          EDGE_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_US_EAST_1 }}
          EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_TOKYO }}
          HOSTED_ZONE_ID: ${{ vars.RECORDS_HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.RECORDS_HOSTED_ZONE_NAME }}
          PLAN_ROLE_ARN: ${{ vars.AWS_RECORDS_PLAN_ROLE_ARN }}
          PUBLIC_HOSTNAME: ${{ vars.RECORDS_PUBLIC_HOSTNAME }}
          SOURCE_STREAM_ARN: ${{ inputs.source_stream_arn }}
        run: |
          for value in \
            "${ASSET_BUCKET}" \
            "${EXECUTION_ROLE_ARN}" \
            "${EDGE_EXECUTION_ROLE_ARN}" \
            "${HOSTED_ZONE_ID}" \
            "${HOSTED_ZONE_NAME}" \
            "${PLAN_ROLE_ARN}" \
            "${PUBLIC_HOSTNAME}"
          do
            test -n "${value}"
          done
          [[ "${SOURCE_STREAM_ARN}" =~ ^arn:[^:]+:dynamodb:${AWS_REGION}:[0-9]{12}:table/shittim-chest-production/stream/.+$ ]]
          [[ "${PUBLIC_HOSTNAME}" =~ ^[a-z0-9.-]+$ ]]
          [[ "${HOSTED_ZONE_ID}" =~ ^Z[A-Z0-9]+$ ]]
      - name: Acquire Records plan credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RECORDS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: records-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 2700
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Verify Records deployment account and parameter metadata
        env:
          IDENTITY_PARAMETER_NAME: /shittim-chest/production/records/identity-hmac-key
          OAUTH_CLIENT_SECRET_PARAMETER_NAME: /shittim-chest/production/records/discord/client-secret
          OAUTH_CONFIG_PARAMETER_NAME: /shittim-chest/production/records/discord/oauth/v0001
          PRESENTATION_PARAMETER_NAME: /shittim-chest/production/records/presentation/v0001
          SESSION_KEY_PARAMETER_NAME: /shittim-chest/production/records/session-key
          SOURCE_STREAM_ARN: ${{ inputs.source_stream_arn }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          stream_account=$(cut -d: -f5 <<< "${SOURCE_STREAM_ARN}")
          test "${stream_account}" = "${account}"
          for name in \
            "${IDENTITY_PARAMETER_NAME}" \
            "${PRESENTATION_PARAMETER_NAME}" \
            "${OAUTH_CONFIG_PARAMETER_NAME}" \
            "${OAUTH_CLIENT_SECRET_PARAMETER_NAME}" \
            "${SESSION_KEY_PARAMETER_NAME}"
          do
            metadata=$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=${name}" \
              --max-results 1 --output json)
            jq --exit-status --arg name "${name}" \
              '.Parameters | length == 1 and
               .[0].Name == $name and .[0].Type == "SecureString"' \
              <<< "${metadata}" >/dev/null
          done
      - name: Upload immutable bundle and synthesize standalone templates
        id: assets
        env:
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          BUNDLE_HASH: ${{ steps.bundle.outputs.bundle_hash }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "${ASSET_BUCKET}" = "cdk-hnb659fds-assets-${account}-${AWS_REGION}"
          edge_asset_bucket="cdk-hnb659fds-assets-${account}-us-east-1"
          bundle_key="${BUNDLE_HASH}.zip"
          upload=$(aws s3api put-object --bucket "${ASSET_BUCKET}" --key "${bundle_key}" \
            --body "${RUNNER_TEMP}/records-lambda.zip" --output json)
          bundle_version=$(jq --exit-status --raw-output .VersionId <<< "${upload}")
          test -n "${bundle_version}"
          CDK_DEFAULT_ACCOUNT="${account}" CDK_DEFAULT_REGION="${AWS_REGION}" \
            npm run synth:records
          for stack in RecordsStateful RecordsApplication RecordsEdge
          do
            template="cdk.out/${stack}.template.json"
            key=$(sha256sum "${template}" | cut -d' ' -f1).json
            if [ "${stack}" = RecordsEdge ]; then
              bucket="${edge_asset_bucket}"
              region=us-east-1
            else
              bucket="${ASSET_BUCKET}"
              region="${AWS_REGION}"
            fi
            aws s3api put-object --region "${region}" --bucket "${bucket}" --key "${key}" \
              --body "${template}" >/dev/null
            echo "${stack} ${region} ${bucket} ${key}" \
              >> "${RUNNER_TEMP}/template-assets.txt"
          done
          echo "bundle_key=${bundle_key}" >> "${GITHUB_OUTPUT}"
          echo "bundle_version=${bundle_version}" >> "${GITHUB_OUTPUT}"
      - name: Create and validate the three Records Change Sets
        id: plan
        env:
          APPLICATION_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-application
          ASSET_BUCKET: ${{ vars.CDK_ASSET_BUCKET }}
          BUNDLE_KEY: ${{ steps.assets.outputs.bundle_key }}
          BUNDLE_CODE_SHA256: ${{ steps.bundle.outputs.bundle_code_sha256 }}
          BUNDLE_VERSION: ${{ steps.assets.outputs.bundle_version }}
          EDGE_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-edge
          EDGE_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_US_EAST_1 }}
          EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN_TOKYO }}
          HOSTED_ZONE_ID: ${{ vars.RECORDS_HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.RECORDS_HOSTED_ZONE_NAME }}
          PUBLIC_HOSTNAME: ${{ vars.RECORDS_PUBLIC_HOSTNAME }}
          SOURCE_STREAM_ARN: ${{ inputs.source_stream_arn }}
          STATEFUL_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-stateful
        run: |
          create_plan() {
            local logical_name="$1" stack="$2" change_set="$3" region="$4"
            local execution_role="$5" template_bucket="$6" template_key="$7"
            local stack_status type arn status
            shift 7
            if aws cloudformation describe-stacks --region "${region}" --stack-name "${stack}" \
              > "${RUNNER_TEMP}/${logical_name}-stack.json" \
              2> "${RUNNER_TEMP}/${logical_name}-stack.error"
            then
              stack_status=$(jq --exit-status --raw-output '.Stacks[0].StackStatus' \
                "${RUNNER_TEMP}/${logical_name}-stack.json")
            else
              grep --quiet "does not exist" "${RUNNER_TEMP}/${logical_name}-stack.error"
              stack_status=""
            fi
            case "${stack_status}" in
              ""|REVIEW_IN_PROGRESS) type=CREATE ;;
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                type=UPDATE
                ;;
              *) exit 1 ;;
            esac
            arn=$(aws cloudformation create-change-set \
              --region "${region}" \
              --stack-name "${stack}" \
              --change-set-name "${change_set}" \
              --change-set-type "${type}" \
              --description "Records ${GITHUB_SHA} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
              --template-url "https://${template_bucket}.s3.${region}.amazonaws.com/${template_key}" \
              --role-arn "${execution_role}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --client-token "records-${logical_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$@" --query Id --output text)
            for attempt in $(seq 1 60)
            do
              status=$(aws cloudformation describe-change-set \
                --region "${region}" \
                --change-set-name "${arn}" --query Status --output text)
              case "${status}" in
                CREATE_COMPLETE|FAILED) break ;;
              esac
              test "${attempt}" -lt 60
              sleep 5
            done
            aws cloudformation describe-change-set \
              --region "${region}" \
              --change-set-name "${arn}" \
              > "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json"
            uv run --project services/records --frozen python \
              tools/release_supply_chain.py validate-change-set \
              "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json" \
              --expected-arn "${arn}" --expected-stack "${stack}"
            if [ "${logical_name}" = application ]; then
              uv run --project services/records --frozen python \
                tools/release_supply_chain.py validate-change-set \
                "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json" \
                --expected-arn "${arn}" --expected-stack "${stack}" \
                --expected-parameter "SourceDebateTableStreamArn=${SOURCE_STREAM_ARN}" \
                --expected-parameter "RecordsBundleBucketName=${ASSET_BUCKET}" \
                --expected-parameter "RecordsBundleObjectKey=${BUNDLE_KEY}" \
                --expected-parameter "RecordsBundleObjectVersion=${BUNDLE_VERSION}" \
                --expected-parameter "RecordsBundleCodeSha256=${BUNDLE_CODE_SHA256}"
            elif [ "${logical_name}" = edge ]; then
              uv run --project services/records --frozen python \
                tools/release_supply_chain.py validate-change-set \
                "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json" \
                --expected-arn "${arn}" --expected-stack "${stack}" \
                --expected-parameter "RecordsPublicHostname=${PUBLIC_HOSTNAME}" \
                --expected-parameter "RecordsHostedZoneId=${HOSTED_ZONE_ID}" \
                --expected-parameter "RecordsHostedZoneName=${HOSTED_ZONE_NAME}" \
                --expected-parameter "RecordsApiOriginDomain=${api_origin_domain}" \
                --expected-parameter "RecordsMediaOriginDomain=${media_origin_domain}"
            fi
            uv run --project services/records --frozen python \
              tools/records_release_manifest.py create-entry \
              "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json" \
              --type "${type}" --expected-name "${change_set}" --expected-region "${region}" \
              --expected-stack "${stack}" \
              --output "${RUNNER_TEMP}/records-release-${logical_name}-plan.json"
            jq --exit-status \
              '[.Changes[].ResourceChange // empty] |
               all(.[];
                 if .ResourceType == "AWS::CDK::Metadata" then
                   (.Action == "Add" and
                    (.Replacement // "False") == "False") or
                   (.Action == "Modify" and
                    ((.Replacement // "False") == "False" or
                     .Replacement == "Conditional"))
                 else
                   .Action != "Remove" and
                   (.Replacement // "False") == "False"
                 end)' \
              "${RUNNER_TEMP}/records-release-${logical_name}-change-set.json" >/dev/null
          }
          stateful_region=$(awk '$1 == "RecordsStateful" {print $2}' \
            "${RUNNER_TEMP}/template-assets.txt")
          stateful_bucket=$(awk '$1 == "RecordsStateful" {print $3}' \
            "${RUNNER_TEMP}/template-assets.txt")
          stateful_key=$(awk '$1 == "RecordsStateful" {print $4}' \
            "${RUNNER_TEMP}/template-assets.txt")
          application_region=$(awk '$1 == "RecordsApplication" {print $2}' \
            "${RUNNER_TEMP}/template-assets.txt")
          application_bucket=$(awk '$1 == "RecordsApplication" {print $3}' \
            "${RUNNER_TEMP}/template-assets.txt")
          application_key=$(awk '$1 == "RecordsApplication" {print $4}' \
            "${RUNNER_TEMP}/template-assets.txt")
          edge_region=$(awk '$1 == "RecordsEdge" {print $2}' \
            "${RUNNER_TEMP}/template-assets.txt")
          edge_bucket=$(awk '$1 == "RecordsEdge" {print $3}' \
            "${RUNNER_TEMP}/template-assets.txt")
          edge_key=$(awk '$1 == "RecordsEdge" {print $4}' \
            "${RUNNER_TEMP}/template-assets.txt")
          account=$(aws sts get-caller-identity --query Account --output text)
          api_endpoint=$(aws cloudformation describe-stacks \
            --stack-name ShittimChest-Prod-RecordsApplication \
            --query "Stacks[0].Outputs[?OutputKey=='RecordsApiEndpoint'].OutputValue | [0]" \
            --output text)
          [[ "${api_endpoint}" =~ ^https://[a-z0-9]+\.execute-api\.${AWS_REGION}\.amazonaws\.com/?$ ]]
          api_origin_domain=${api_endpoint#https://}
          api_origin_domain=${api_origin_domain%/}
          media_origin_domain="shittim-chest-production-records-media-${account}.s3.${AWS_REGION}.amazonaws.com"
          set -e
          create_plan stateful ShittimChest-Prod-RecordsStateful \
            "${STATEFUL_CHANGE_SET}" "${stateful_region}" "${EXECUTION_ROLE_ARN}" \
            "${stateful_bucket}" "${stateful_key}"
          create_plan application ShittimChest-Prod-RecordsApplication \
            "${APPLICATION_CHANGE_SET}" "${application_region}" "${EXECUTION_ROLE_ARN}" \
            "${application_bucket}" "${application_key}" \
            --parameters \
              ParameterKey=SourceDebateTableStreamArn,ParameterValue="${SOURCE_STREAM_ARN}" \
              ParameterKey=RecordsBundleBucketName,ParameterValue="${ASSET_BUCKET}" \
              ParameterKey=RecordsBundleObjectKey,ParameterValue="${BUNDLE_KEY}" \
              ParameterKey=RecordsBundleObjectVersion,ParameterValue="${BUNDLE_VERSION}" \
              ParameterKey=RecordsBundleCodeSha256,ParameterValue="${BUNDLE_CODE_SHA256}"
          create_plan edge ShittimChest-Prod-RecordsEdge \
            "${EDGE_CHANGE_SET}" "${edge_region}" "${EDGE_EXECUTION_ROLE_ARN}" \
            "${edge_bucket}" "${edge_key}" \
            --parameters \
              ParameterKey=RecordsPublicHostname,ParameterValue="${PUBLIC_HOSTNAME}" \
              ParameterKey=RecordsHostedZoneId,ParameterValue="${HOSTED_ZONE_ID}" \
              ParameterKey=RecordsHostedZoneName,ParameterValue="${HOSTED_ZONE_NAME}" \
              ParameterKey=RecordsApiOriginDomain,ParameterValue="${api_origin_domain}" \
              ParameterKey=RecordsMediaOriginDomain,ParameterValue="${media_origin_domain}"
      - name: Record Records release evidence
        id: evidence
        env:
          BUNDLE_HASH: ${{ steps.bundle.outputs.bundle_hash }}
          WEB_HASH: ${{ steps.web.outputs.web_hash }}
          WEB_SBOM_HASH: ${{ steps.web_sbom.outputs.web_sbom_hash }}
        run: |
          artifact_name="records-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv run --project services/records --frozen python \
            tools/records_release_manifest.py create-manifest \
            --stateful-plan "${RUNNER_TEMP}/records-release-stateful-plan.json" \
            --application-plan "${RUNNER_TEMP}/records-release-application-plan.json" \
            --edge-plan "${RUNNER_TEMP}/records-release-edge-plan.json" \
            --commit-sha "${GITHUB_SHA}" --bundle-sha256 "${BUNDLE_HASH}" \
            --web-artifact-sha256 "${WEB_HASH}" \
            --web-sbom-sha256 "${WEB_SBOM_HASH}" \
            --output "${RUNNER_TEMP}/records-release-manifest.json"
          mkdir -p "${RUNNER_TEMP}/records-evidence"
          cp "${RUNNER_TEMP}/records-release-manifest.json" \
            "${RUNNER_TEMP}/records-sbom.cdx.json" \
            "${RUNNER_TEMP}/records-web.zip" \
            "${RUNNER_TEMP}/records-web-sbom.cdx.json" \
            "${RUNNER_TEMP}"/records-release-*.json \
            "${RUNNER_TEMP}/records-evidence/"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Attest the Records release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/records-release-manifest.json
      - name: Attest the Records Web artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/records-web.zip
      - name: Upload Records plan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/records-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove attested no-op Records Change Sets before approval
        run: |
          manifest="${RUNNER_TEMP}/records-release-manifest.json"
          for logical_name in stateful application edge
          do
            region=$(jq --exit-status --raw-output \
              --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].region' "${manifest}")
            executable=$(jq --exit-status --raw-output \
              --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].executable
               | if type == "boolean" then tostring else error("executable must be boolean") end' \
              "${manifest}")
            if [ "${executable}" = false ]; then
              arn=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
                '.change_sets[$logical_name].arn' "${manifest}")
              aws cloudformation delete-change-set --region "${region}" \
                --change-set-name "${arn}"
              for attempt in $(seq 1 12)
              do
                if aws cloudformation describe-change-set --region "${region}" \
                  --change-set-name "${arn}" \
                  >/dev/null 2> "${RUNNER_TEMP}/${logical_name}-noop-cleanup.error"
                then
                  test "${attempt}" -lt 12
                  sleep 5
                  continue
                fi
                grep --quiet "does not exist" \
                  "${RUNNER_TEMP}/${logical_name}-noop-cleanup.error"
                break
              done
            fi
          done
      - name: Clean up unexecuted Change Sets after plan failure
        if: failure()
        continue-on-error: true
        env:
          APPLICATION_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-application
          EDGE_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-edge
          STATEFUL_CHANGE_SET: records-release-${{ github.run_id }}-${{ github.run_attempt }}-stateful
        run: |
          aws cloudformation delete-change-set \
            --stack-name ShittimChest-Prod-RecordsApplication \
            --change-set-name "${APPLICATION_CHANGE_SET}" 2>/dev/null || true
          aws cloudformation delete-change-set \
            --stack-name ShittimChest-Prod-RecordsStateful \
            --change-set-name "${STATEFUL_CHANGE_SET}" 2>/dev/null || true
          aws cloudformation delete-change-set --region us-east-1 \
            --stack-name ShittimChest-Prod-RecordsEdge \
            --change-set-name "${EDGE_CHANGE_SET}" 2>/dev/null || true

  deploy:
    name: deploy
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Download the attested Records plan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/records-evidence
      - name: Check out the fixed Records release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Python and uv for evidence validation
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/records/uv.lock
      - name: Revalidate the Records plan attestation and fixed SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="${RUNNER_TEMP}/records-evidence/records-release-manifest.json"
          gh attestation verify "${manifest}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow pitekusu/shittim-chest/.github/workflows/records-release.yml \
            --source-ref refs/heads/main
          gh attestation verify "${RUNNER_TEMP}/records-evidence/records-web.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow pitekusu/shittim-chest/.github/workflows/records-release.yml \
            --source-ref refs/heads/main
          uv run --project services/records --frozen python \
            tools/records_release_manifest.py validate-manifest "${manifest}" \
            --expected-commit-sha "${GITHUB_SHA}"
          expected_web_hash=$(jq --exit-status --raw-output \
            .web_artifact_sha256 "${manifest}")
          actual_web_hash=$(sha256sum \
            "${RUNNER_TEMP}/records-evidence/records-web.zip" | cut -d' ' -f1)
          test "${actual_web_hash}" = "${expected_web_hash}"
          expected_web_sbom_hash=$(jq --exit-status --raw-output \
            .web_sbom_sha256 "${manifest}")
          actual_web_sbom_hash=$(sha256sum \
            "${RUNNER_TEMP}/records-evidence/records-web-sbom.cdx.json" | cut -d' ' -f1)
          test "${actual_web_sbom_hash}" = "${expected_web_sbom_hash}"
      - name: Acquire Records deploy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_RECORDS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: records-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 2700
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Execute only the attested Records Change Sets
        run: |
          execute() {
            local logical_name="$1" stack name arn region type executable
            stack=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].stack' "${manifest}")
            name=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].name' "${manifest}")
            arn=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].arn' "${manifest}")
            region=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].region' "${manifest}")
            type=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].type' "${manifest}")
            executable=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].executable
               | if type == "boolean" then tostring else error("executable must be boolean") end' \
              "${manifest}")
            if [ "${executable}" = true ]; then
              aws cloudformation describe-change-set --region "${region}" \
                --change-set-name "${arn}" \
                > "${RUNNER_TEMP}/${logical_name}-deploy-change-set.json"
              if [ "${logical_name}" = application ]; then
                bundle_hash=$(jq --exit-status --raw-output .bundle_sha256 "${manifest}")
                bundle_code_sha256=$(printf '%s' "${bundle_hash}" | xxd -r -p | base64 -w0)
                uv run --project services/records --frozen python \
                  tools/release_supply_chain.py validate-change-set \
                  "${RUNNER_TEMP}/${logical_name}-deploy-change-set.json" \
                  --expected-arn "${arn}" --expected-stack "${stack}" \
                  --expected-parameter "RecordsBundleCodeSha256=${bundle_code_sha256}"
              fi
              uv run --project services/records --frozen python \
                tools/records_release_manifest.py create-entry \
                "${RUNNER_TEMP}/${logical_name}-deploy-change-set.json" \
                --type "${type}" --expected-name "${name}" \
                --expected-region "${region}" --expected-stack "${stack}" \
                --output "${RUNNER_TEMP}/${logical_name}-deploy-plan.json"
              jq --exit-status --arg logical_name "${logical_name}" \
                --slurpfile actual "${RUNNER_TEMP}/${logical_name}-deploy-plan.json" \
                '.change_sets[$logical_name] == $actual[0]' "${manifest}" >/dev/null
              aws cloudformation execute-change-set --region "${region}" \
                --change-set-name "${arn}"
              case "${type}" in
                CREATE)
                  aws cloudformation wait stack-create-complete --region "${region}" \
                    --stack-name "${stack}"
                  ;;
                UPDATE)
                  aws cloudformation wait stack-update-complete --region "${region}" \
                    --stack-name "${stack}"
                  ;;
                *)
                  echo "Unexpected attested Change Set type." >&2
                  exit 1
                  ;;
              esac
            fi
            status=$(aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" \
              --query 'Stacks[0].StackStatus' --output text)
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              *) exit 1 ;;
            esac
            aws cloudformation update-termination-protection \
              --region "${region}" --enable-termination-protection --stack-name "${stack}"
            aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" --output json \
              | jq --exit-status '.Stacks[0].EnableTerminationProtection == true' >/dev/null
          }
          manifest="${RUNNER_TEMP}/records-evidence/records-release-manifest.json"
          execute stateful
          execute application
          execute edge
      - name: Publish the attested Records Web artifact
        run: |
          web_archive="${RUNNER_TEMP}/records-evidence/records-web.zip"
          web_stage="${RUNNER_TEMP}/records-web-dist"
          mkdir -p "${web_stage}"
          WEB_ARCHIVE="${web_archive}" WEB_STAGE="${web_stage}" python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          archive = pathlib.Path(os.environ["WEB_ARCHIVE"])
          destination = pathlib.Path(os.environ["WEB_STAGE"])
          with zipfile.ZipFile(archive) as source:
              for item in source.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts or item.is_dir():
                      raise SystemExit("unsafe Records Web artifact")
              source.extractall(destination)
          if not (destination / "index.html").is_file():
              raise SystemExit("Records Web artifact has no index.html")
          PY
          edge_stack=$(aws cloudformation describe-stacks --region us-east-1 \
            --stack-name ShittimChest-Prod-RecordsEdge --output json)
          web_bucket=$(jq --exit-status --raw-output \
            '.Stacks[0].Outputs[] | select(.OutputKey == "RecordsWebBucketName") | .OutputValue' \
            <<< "${edge_stack}")
          distribution_id=$(jq --exit-status --raw-output \
            '.Stacks[0].Outputs[] | select(.OutputKey == "RecordsDistributionId") | .OutputValue' \
            <<< "${edge_stack}")
          public_origin=$(jq --exit-status --raw-output \
            '.Stacks[0].Outputs[] | select(.OutputKey == "RecordsPublicOrigin") | .OutputValue' \
            <<< "${edge_stack}")
          account=$(aws sts get-caller-identity --query Account --output text)
          test "${web_bucket}" = "shittim-chest-production-records-web-${account}"
          [[ "${distribution_id}" =~ ^[A-Z0-9]+$ ]]
          [[ "${public_origin}" =~ ^https://[a-z0-9.-]+$ ]]
          aws s3api get-bucket-versioning --bucket "${web_bucket}" --output json \
            | jq --exit-status '.Status == "Enabled"' >/dev/null
          if aws s3api head-object --bucket "${web_bucket}" --key index.html \
            > "${RUNNER_TEMP}/records-previous-index.json" \
            2> "${RUNNER_TEMP}/records-previous-index.error"
          then
            jq --exit-status --raw-output '.VersionId // empty' \
              "${RUNNER_TEMP}/records-previous-index.json" \
              > "${RUNNER_TEMP}/records-previous-index-version"
          else
            grep --extended-regexp --quiet '404|Not Found' \
              "${RUNNER_TEMP}/records-previous-index.error"
            : > "${RUNNER_TEMP}/records-previous-index-version"
          fi
          printf '%s' "${web_bucket}" > "${RUNNER_TEMP}/records-web-bucket"
          printf '%s' "${distribution_id}" > "${RUNNER_TEMP}/records-distribution-id"
          aws s3 cp "${web_stage}/assets" "s3://${web_bucket}/assets" \
            --recursive \
            --cache-control "public,max-age=31536000,immutable"
          test "$(find "${web_stage}" -mindepth 1 -maxdepth 1 -type f \
            ! -name index.html | wc -l)" -eq 0
          aws s3 cp "${web_stage}/index.html" "s3://${web_bucket}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          touch "${RUNNER_TEMP}/records-index-published"
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" --paths "/index.html" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${distribution_id}" --id "${invalidation_id}"
          printf '%s' "${public_origin}" > "${RUNNER_TEMP}/records-public-origin"
      - name: Verify stable Records Stack results
        run: |
          for stack_region in \
            ShittimChest-Prod-RecordsStateful:ap-northeast-1 \
            ShittimChest-Prod-RecordsApplication:ap-northeast-1 \
            ShittimChest-Prod-RecordsEdge:us-east-1
          do
            stack=${stack_region%:*}
            region=${stack_region#*:}
            status=$(aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" \
              --query 'Stacks[0].StackStatus' --output text)
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
              *) exit 1 ;;
            esac
            aws cloudformation describe-stacks --region "${region}" \
              --stack-name "${stack}" --output json \
              | jq --exit-status '.Stacks[0].EnableTerminationProtection == true' >/dev/null
          done
      - name: Verify anonymous and protected Records API boundaries
        run: |
          endpoint=$(cat "${RUNNER_TEMP}/records-public-origin")
          [[ "${endpoint}" =~ ^https://[a-z0-9.-]+$ ]]
          index_status=$(curl --silent --show-error --location \
            --output "${RUNNER_TEMP}/records-index.html" --write-out '%{http_code}' \
            "${endpoint}/")
          test "${index_status}" = 200
          grep --quiet '<div id="root"></div>' "${RUNNER_TEMP}/records-index.html"
          session_status=$(curl --silent --show-error \
            --dump-header "${RUNNER_TEMP}/records-session.headers" \
            --output "${RUNNER_TEMP}/records-session.json" \
            --write-out '%{http_code}' \
            "${endpoint}/api/v1/session")
          test "${session_status}" = 200
          jq --exit-status \
            '.schemaVersion == 1 and .authenticated == false and
             .user == null and .csrfToken == null' \
            "${RUNNER_TEMP}/records-session.json" >/dev/null
          grep --ignore-case --quiet '^cache-control: private, no-store' \
            "${RUNNER_TEMP}/records-session.headers"
          if grep --ignore-case --quiet '^set-cookie:' \
            "${RUNNER_TEMP}/records-session.headers"
          then
            exit 1
          fi
          records_status=$(curl --silent --show-error \
            --dump-header "${RUNNER_TEMP}/records-list.headers" \
            --output "${RUNNER_TEMP}/records-list.json" \
            --write-out '%{http_code}' \
            "${endpoint}/api/v1/records")
          test "${records_status}" = 401
          jq --exit-status '.error.code == "AUTHENTICATION_REQUIRED"' \
            "${RUNNER_TEMP}/records-list.json" >/dev/null
      - name: Restore the previous Records entry point after a post-publish failure
        if: failure()
        continue-on-error: true
        run: |
          if [ ! -f "${RUNNER_TEMP}/records-index-published" ]; then
            exit 0
          fi
          web_bucket=$(cat "${RUNNER_TEMP}/records-web-bucket")
          distribution_id=$(cat "${RUNNER_TEMP}/records-distribution-id")
          previous_version=$(cat "${RUNNER_TEMP}/records-previous-index-version")
          if [ -n "${previous_version}" ]; then
            encoded_version=$(jq --null-input --raw-output --arg value "${previous_version}" \
              '$value | @uri')
            aws s3api copy-object \
              --bucket "${web_bucket}" \
              --key index.html \
              --copy-source "${web_bucket}/index.html?versionId=${encoded_version}" \
              --cache-control "no-cache" \
              --content-type "text/html; charset=utf-8" \
              --metadata-directive REPLACE >/dev/null
          else
            aws s3api delete-object --bucket "${web_bucket}" --key index.html >/dev/null
          fi
          rollback_invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "${distribution_id}" --paths "/index.html" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${distribution_id}" --id "${rollback_invalidation}"
      - name: Clean up only unexecuted Records Change Sets
        if: always()
        continue-on-error: true
        run: |
          manifest="${RUNNER_TEMP}/records-evidence/records-release-manifest.json"
          for logical_name in stateful application edge
          do
            arn=$(jq --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].arn // empty' "${manifest}" 2>/dev/null || true)
            region=$(jq --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].region // empty' "${manifest}" 2>/dev/null || true)
            status=$(aws cloudformation describe-change-set --region "${region}" \
              --change-set-name "${arn}" \
              --query Status --output text 2>/dev/null || true)
            execution=$(aws cloudformation describe-change-set --region "${region}" \
              --change-set-name "${arn}" \
              --query ExecutionStatus --output text 2>/dev/null || true)
            if [ "${status}" = CREATE_COMPLETE ] && [ "${execution}" = AVAILABLE ]; then
              aws cloudformation delete-change-set --region "${region}" \
                --change-set-name "${arn}"
            fi
          done
      - name: Confirm this Records release has no unexecuted Change Sets
        if: always()
        run: |
          manifest="${RUNNER_TEMP}/records-evidence/records-release-manifest.json"
          for logical_name in stateful application edge
          do
            arn=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].arn' "${manifest}")
            region=$(jq --exit-status --raw-output --arg logical_name "${logical_name}" \
              '.change_sets[$logical_name].region' "${manifest}")
            if ! aws cloudformation describe-change-set --region "${region}" \
              --change-set-name "${arn}" \
              > "${RUNNER_TEMP}/${logical_name}-final-change-set.json" \
              2> "${RUNNER_TEMP}/${logical_name}-final-change-set.error"
            then
              grep --quiet "does not exist" \
                "${RUNNER_TEMP}/${logical_name}-final-change-set.error"
              continue
            fi
            status=$(jq --exit-status --raw-output .Status \
              "${RUNNER_TEMP}/${logical_name}-final-change-set.json")
            execution=$(jq --exit-status --raw-output .ExecutionStatus \
              "${RUNNER_TEMP}/${logical_name}-final-change-set.json")
            if [ "${status}" = CREATE_COMPLETE ] && [ "${execution}" = AVAILABLE ]; then
              echo "Unexecuted Records Change Set remains after cleanup." >&2
              exit 1
            fi
          done
