name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "19 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Install the same JDK as local development
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: apps/records-android/.java-version
      - name: Select the filtered JDK trust store
        if: ${{ matrix.language == 'java-kotlin' }}
        run: >-
          python3 -m tools.configure_build_tls --java
          --output "${RUNNER_TEMP}/shittim-tls" --github-env "${GITHUB_ENV}"
      - name: Validate the Wrapper without restoring Gradle caches
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Install the compile SDK and build tools
        if: ${{ matrix.language == 'java-kotlin' }}
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.2" "build-tools;37.0.0"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Rebuild Android for Java and Kotlin extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        run: >-
          apps/records-android/gradlew -p apps/records-android
          --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.incremental=false :app:assembleDebug
      - name: Analyze the selected language
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
