name: Android Closed Release

on:
  workflow_dispatch:
    inputs:
      minimum_version_code:
        description: Minimum versionCode after inspecting any previous failed submission
        type: string
        default: "1"
        required: true
      release_notes_ja:
        description: Japanese release notes describing this update (1-500 Unicode characters)
        type: string
        required: true

permissions: {}

concurrency:
  group: android-internal-release
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  UV_VERSION: "0.13.6"

jobs:
  release:
    if: github.repository == 'pitekusu/shittim-chest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    environment: android-internal
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the immutable main workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Select the fixed private runner state directory
        run: printf 'STATE=%s/android-release\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
      - name: Install pinned Python and uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          python-version: "3.14.10"
          enable-cache: false
      - name: Require successful same-SHA main CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
          WIF_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          CERTIFICATE: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          test "${RELEASE_ENABLED}" = true
          test -n "${WIF_PROVIDER}" && test -n "${PLAY_ACCOUNT}" && test -n "${CERTIFICATE}"
          test "${GITHUB_RUN_ATTEMPT}" = 1
          uv sync --frozen --all-groups
          uv run --frozen python tools/check_release_ci.py
      - name: Install the pinned Android JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: apps/records-android/.java-version
      - name: Select the filtered JDK trust store
        run: >-
          python3 -m tools.configure_build_tls --java
          --output "${RUNNER_TEMP}/shittim-tls" --github-env "${GITHUB_ENV}"
      - name: Validate the Wrapper without restoring build caches
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Install the compile SDK and build tools
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"'
      - name: Prepare private upload signing and Firebase inputs
        env:
          RELEASE_NOTES_JA: ${{ inputs.release_notes_ja }}
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          FIREBASE_CLIENT_CONFIG: ${{ secrets.ANDROID_FIREBASE_CLIENT_CONFIG }}
        run: uv run --frozen python -m tools.android_release materialize --state "${STATE}"
      - name: Authenticate only to inspect current Play versions
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Choose a version greater than all current tracks bundles and APKs
        id: version
        env:
          MINIMUM_VERSION_CODE: ${{ inputs.minimum_version_code }}
        run: uv run --frozen python -m tools.android_release preflight --state "${STATE}"
      - name: Build and lint the signed Release once
        env:
          SHITTIM_ANDROID_UPLOAD_KEYSTORE: ${{ runner.temp }}/android-release/upload-key.p12
          SHITTIM_ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SHITTIM_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          SHITTIM_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SHITTIM_ANDROID_FIREBASE_CONFIG: ${{ runner.temp }}/android-release/google-services.json
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          umask 077
          if ! apps/records-android/gradlew -p apps/records-android --no-daemon \
            :app:bundleRelease :app:lintRelease \
            -PshittimAndroidVersionCode="${VERSION_CODE}" \
            -PshittimAndroidVersionName="0.0.${VERSION_CODE}" > "${STATE}/gradle-build.log" 2>&1; then
            echo "android_release_build_failed" >&2
            exit 1
          fi
      - name: Download digest-pinned official bundletool
        run: |
          version=$(jq -r '.tools.bundletool.version' .github/tool-versions.json)
          archive=$(jq -r '.tools.bundletool.archive_name' .github/tool-versions.json)
          checksum=$(jq -r '.tools.bundletool.archive_sha256' .github/tool-versions.json)
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${version}/${archive}" \
            --output "${STATE}/bundletool.jar"
          printf '%s  %s\n' "${checksum}" "${STATE}/bundletool.jar" | sha256sum --check --strict
      - name: Verify signature certificate package version and immutable bundle digest
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: uv run --frozen python -m tools.android_release verify --state "${STATE}" --bundletool "${STATE}/bundletool.jar"
      - name: Renew federated credentials immediately before publishing
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Upload the verified AAB to the closed track with the maintained Action
        uses: r0adkll/upload-google-play@744d577ff543375f35f60408e13fb32c7caa90ce # master (v1.1.5 + dependency updates)
        with:
          serviceAccountJson: ${{ steps.play-auth.outputs.credentials_file_path }}
          packageName: dev.pitekusu.shittim.records
          releaseFiles: ${{ runner.temp }}/android-release/verified/app-release.aab
          tracks: alpha
          status: completed
          releaseName: "0.0.${{ steps.version.outputs.version_code }}"
          whatsNewDirectory: ${{ runner.temp }}/android-release/whatsnew
      - name: Read back the submitted closed track and bundle digest
        run: uv run --frozen python -m tools.android_release readback --state "${STATE}"
      - name: Retain only non-secret verification and submission receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-closed-receipt-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-release/verification.json
            ${{ runner.temp }}/android-release/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove private signing Firebase and Gradle log files
        if: always()
        run: uv run --frozen python -m tools.android_release cleanup --state "${STATE}"
