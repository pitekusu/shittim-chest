name: Infrastructure Drift

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: infrastructure-drift
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  AWS_REGION: ap-northeast-1
  COST_REGION: us-east-1

jobs:
  drift:
    name: drift
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Require the immutable main branch
        env:
          EXPECTED_REF: refs/heads/main
          EXPECTED_REPOSITORY: pitekusu/shittim-chest
          EXPECTED_REPOSITORY_ID: "1302516701"
        run: |
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REPOSITORY_ID}" = "${EXPECTED_REPOSITORY_ID}"
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the inspected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Validate the read-only role handles
        env:
          DRIFT_ROLE_ARN: ${{ vars.AWS_RELEASE_DRIFT_ROLE_ARN }}
          RECORDS_DRIFT_ROLE_ARN: ${{ vars.AWS_RECORDS_DRIFT_ROLE_ARN }}
        run: |
          test -n "${DRIFT_ROLE_ARN}"
          test -n "${RECORDS_DRIFT_ROLE_ARN}"
      - name: Acquire read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: drift-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Detect stack drift without remediation
        run: |
          result="${RUNNER_TEMP}/drift-results.tsv"
          : > "${result}"
          detect() {
            local stack="$1" region="$2" detection status
            detection=$(aws cloudformation detect-stack-drift \
              --region "${region}" --stack-name "${stack}" \
              --query StackDriftDetectionId --output text)
            for attempt in $(seq 1 60)
            do
              status=$(aws cloudformation describe-stack-drift-detection-status \
                --region "${region}" --stack-drift-detection-id "${detection}" \
                --query DetectionStatus --output text)
              case "${status}" in
                DETECTION_COMPLETE) break ;;
                DETECTION_FAILED) exit 1 ;;
              esac
              test "${attempt}" -lt 60
              sleep 10
            done
            drift=$(aws cloudformation describe-stack-drift-detection-status \
              --region "${region}" --stack-drift-detection-id "${detection}" \
              --query StackDriftStatus --output text)
            printf '%s\t%s\t%s\n' "${stack}" "${region}" "${drift}" >> "${result}"
          }
          detect ShittimChest-Prod-Stateful "${AWS_REGION}"
          detect ShittimChest-Prod-ReleaseIdentity "${AWS_REGION}"
          detect ShittimChest-Prod-Runtime "${AWS_REGION}"
          detect ShittimChest-Prod-Operations "${AWS_REGION}"
          detect ShittimChest-Prod-CostGovernance "${COST_REGION}"
      - name: Acquire read-only Records AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RECORDS_DRIFT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: records-drift-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Detect Records stack drift without remediation
        run: |
          result="${RUNNER_TEMP}/drift-results.tsv"
          test -f "${result}"
          detect() {
            local stack="$1" region="$2" detection status
            detection=$(aws cloudformation detect-stack-drift \
              --region "${region}" --stack-name "${stack}" \
              --query StackDriftDetectionId --output text)
            for attempt in $(seq 1 60)
            do
              status=$(aws cloudformation describe-stack-drift-detection-status \
                --region "${region}" --stack-drift-detection-id "${detection}" \
                --query DetectionStatus --output text)
              case "${status}" in
                DETECTION_COMPLETE) break ;;
                DETECTION_FAILED) exit 1 ;;
              esac
              test "${attempt}" -lt 60
              sleep 10
            done
            drift=$(aws cloudformation describe-stack-drift-detection-status \
              --region "${region}" --stack-drift-detection-id "${detection}" \
              --query StackDriftStatus --output text)
            printf '%s\t%s\t%s\n' "${stack}" "${region}" "${drift}" >> "${result}"
          }
          detect ShittimChest-Prod-RecordsStateful "${AWS_REGION}"
          detect ShittimChest-Prod-RecordsApplication "${AWS_REGION}"
          detect ShittimChest-Prod-RecordsEdge "${COST_REGION}"
      - name: Update the single drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="${RUNNER_TEMP}/drift-results.tsv"
          body="${RUNNER_TEMP}/drift-issue.md"
          {
            echo "Automated read-only CloudFormation drift result for commit ${GITHUB_SHA}."
            echo
            echo "| Stack | Region | Status |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r stack region status
            do
              printf '| %s | %s | %s |\n' "${stack}" "${region}" "${status}"
            done < "${result}"
            echo
            echo "This workflow never remediates drift."
          } > "${body}"
          issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label infrastructure-drift --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if grep --quiet $'\tDRIFTED$' "${result}"
          then
            if [ -n "${issue}" ]; then
              gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
                --title "Infrastructure drift detected" --body-file "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                --title "Infrastructure drift detected" \
                --label infrastructure-drift --body-file "${body}"
            fi
          elif [ -n "${issue}" ]; then
            gh issue comment "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --body-file "${body}"
            gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" \
              --reason completed
          fi
