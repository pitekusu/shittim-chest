name: Production Deploy Guard

on:
  workflow_dispatch:
    inputs:
      break_glass:
        description: "緊急時だけDeploy Guardを明示的に上書きする"
        required: true
        default: false
        type: boolean
      break_glass_reason:
        description: "break-glass時の監査理由コード"
        required: true
        default: none
        type: choice
        options:
          - none
          - incident-response
          - security-investigation
          - service-recovery

permissions: {}

concurrency:
  group: production-deploy-guard
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  AWS_REGION: ap-northeast-1
  PYTHON_VERSION: 3.14.10
  UV_VERSION: 0.13.6

jobs:
  guard:
    name: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the immutable main branch
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "Deploy Guard can run only from refs/heads/main." >&2
            exit 1
          fi
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the trusted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          download-from-astral-mirror: false
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked tool environment
        run: uv sync --frozen --all-groups
      - name: Validate required repository variables
        env:
          GUARD_ROLE_ARN: ${{ vars.AWS_DEPLOY_GUARD_ROLE_ARN }}
          TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: |
          if [ -z "${GUARD_ROLE_ARN}" ] || [ -z "${TABLE_NAME}" ]; then
            echo "Deploy Guard repository variables are not configured." >&2
            exit 1
          fi
      - name: Acquire read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_GUARD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: guard-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 60
      - name: Evaluate the production state
        env:
          BREAK_GLASS: ${{ inputs.break_glass }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass_reason }}
          TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
        run: |
          guard_args=(
            --table-name "${TABLE_NAME}"
            --region "${AWS_REGION}"
            --commit-sha "${GITHUB_SHA}"
            --actor "${GITHUB_TRIGGERING_ACTOR}"
            --run-id "${GITHUB_RUN_ID}"
            --environment production
            --audit-output "${RUNNER_TEMP}/deploy-guard-audit.json"
          )

          if [ "${BREAK_GLASS}" = "true" ]; then
            guard_args+=(--break-glass)
            if [ "${BREAK_GLASS_REASON}" != "none" ]; then
              guard_args+=(--reason "${BREAK_GLASS_REASON}")
            fi
          elif [ "${BREAK_GLASS_REASON}" != "none" ]; then
            # Let the CLI reject the inconsistent context and still create the
            # fail-closed audit artifact required by the always() upload step.
            guard_args+=(--reason "${BREAK_GLASS_REASON}")
          fi

          uv run --frozen python -m tools.control_records guard "${guard_args[@]}"
      - name: Upload the immutable audit record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deploy-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-guard-audit.json
          if-no-files-found: error
          retention-days: 90
