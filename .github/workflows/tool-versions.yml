name: Release Tool Versions

on:
  schedule:
    - cron: "29 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tool-versions
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  check-release-tools:
    name: check-release-tools
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Update and verify system trust before checkout
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --only-upgrade --no-install-recommends ca-certificates
          python3 - <<'PY_TLS'
          import hashlib
          import pathlib
          import re
          import ssl
          denied = {
              "86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b",
              "d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4",
              "7dd78d5f4f13459a83dff9abbba62edbaf6f2d102bf257fd712f4d9f2746ed8d",
              "f2edaaff3d9b701fb4d14c9f285f8c0bad90fc3bcc1fa07d47f4718edaba34a5",
          }
          bundle = "/etc/ssl/certs/ca-certificates.crt"
          if not ssl.create_default_context(cafile=bundle).get_ca_certs():
              raise SystemExit("system CA store is empty; refusing checkout")
          paths = [pathlib.Path(bundle)]
          paths.extend(path for path in pathlib.Path("/etc/ssl/certs").iterdir() if path.is_file())
          for path in paths:
              for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.S):
                  if hashlib.sha256(ssl.PEM_cert_to_DER_cert(pem)).hexdigest() in denied:
                      raise SystemExit("system CA update still trusts an incident root; refusing checkout")
          print("System CA distrust verified before checkout")
          PY_TLS
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the incident TLS trust policy
        uses: ./.github/actions/configure-tls
      - name: Validate pins and compare latest stable releases
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/check_tool_versions.py validate .github/tool-versions.json
          status=0
          python tools/check_tool_versions.py latest .github/tool-versions.json \
            --report "${RUNNER_TEMP}/tool-versions.md" || status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          test -f "${RUNNER_TEMP}/tool-versions.md"
          cat "${RUNNER_TEMP}/tool-versions.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Maintain one actionable update issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            > "${RUNNER_TEMP}/open-issues.json"
          issues=$(jq '[.[][] | select(.pull_request == null and
            .user.login == "github-actions[bot]" and
            ((.body // "") | startswith("<!-- release-tool-versions -->")))]' \
            "${RUNNER_TEMP}/open-issues.json")
          test "$(jq 'length' <<< "${issues}")" -le 1
          issue=$(jq --raw-output '.[0].number // empty' <<< "${issues}")
          if [ "${AUDIT_STATUS}" = 0 ]; then
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" --repo "${GITHUB_REPOSITORY}" --reason completed
            fi
          elif [ "${AUDIT_STATUS}" = 1 ] || [ "${AUDIT_STATUS}" = 2 ]; then
            if [ -n "${issue}" ]; then
              if ! jq --exit-status --rawfile body "${RUNNER_TEMP}/tool-versions.md" \
                '.[0].body == $body' <<< "${issues}" >/dev/null; then
                gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" \
                  --body-file "${RUNNER_TEMP}/tool-versions.md"
              fi
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                --title "固定ツールの更新・取得状況を確認する" \
                --body-file "${RUNNER_TEMP}/tool-versions.md"
            fi
          else
            exit 1
          fi
      - name: Preserve the update or lookup-failure signal
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
        run: test "${AUDIT_STATUS}" = 0
