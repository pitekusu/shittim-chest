version: 2

registries:
  dhi:
    type: "docker-registry"
    url: "https://dhi.io"
    username: "${{secrets.DHI_USERNAME}}"
    password: "${{secrets.DHI_TOKEN}}"

updates:
  # Actions updates cover uses: references, not with: version/driver-opts,
  # workflow env pins, or downloaded CLI archives. Release Tool Versions
  # monitors those fixed tools and keeps one actionable GitHub issue.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Gradle updates include the Wrapper, plugins, and version catalog.
  - package-ecosystem: "gradle"
    directory: "/apps/records-android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
      # Dependabot cannot get activity-compose release dates from Google Maven;
      # the cooldown otherwise filters every version out of update checks.
      exclude:
        - "androidx.activity:activity-compose"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      records-android-kotlin:
        applies-to: "version-updates"
        patterns:
          - "org.jetbrains.kotlin*"
      records-android-compose:
        applies-to: "version-updates"
        patterns:
          - "androidx.compose*"
      records-android-bouncycastle:
        applies-to: "version-updates"
        patterns:
          - "org.bouncycastle:*"
    open-pull-requests-limit: 5

  # Keep [tool.uv].required-version compatible with the updater's embedded uv.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # uv-build follows uv's versioning policy, where minor releases can be
    # breaking. Keep the build backend on the validated 0.12 line.
    ignore:
      - dependency-name: "uv-build"
        versions:
          - ">=0.13"
    open-pull-requests-limit: 5

  # Keep the independently locked Records service current as its own uv project.
  - package-ecosystem: "uv"
    directory: "/services/records"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      records-python-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "uv-build"
        versions:
          - ">=0.13"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:00"
      timezone: "Asia/Tokyo"
    registries:
      - "dhi"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    # uv minor releases can contain breaking changes. Keep the Docker stage
    # aligned with [tool.uv].required-version on the validated 0.12 line.
    ignore:
      - dependency-name: "astral-sh/uv"
        versions:
          - ">=0.13"
    open-pull-requests-limit: 5

  # Test services and BuildKit share these image pins across local/CI/release use.
  - package-ecosystem: "docker"
    directory: "/tools/containers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:15"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      cdk-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"
          - "cdk-nag"
        update-types:
          - "minor"
          - "patch"
      typescript-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "@types/node"
          - "tsx"
          - "typescript"
          - "vitest"
        update-types:
          - "minor"
          - "patch"
    # Match the Node 24 runtime; change this alongside a runtime major upgrade.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/records-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:45"
      timezone: "Asia/Tokyo"
    assignees:
      - "pitekusu"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Vite+ needs its npm alias and pnpm overrides updated together. Keep
      # these PRs separate; the tool-version check detects partial updates.
      records-web-vite-plus:
        applies-to: "version-updates"
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/vite-plus-core"
          - "vitest"
      records-web-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Upgrade Vite+ and its core/Vitest overrides together in a dedicated change.
      - dependency-name: "vite-plus"
        versions:
          - ">=0.4"
      - dependency-name: "vitest"
        versions:
          - ">4.1.11"
    open-pull-requests-limit: 5
