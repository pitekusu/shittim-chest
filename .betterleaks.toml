title = "Shittim Chest secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "AWS Signer Notation public PGP key checksum"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*AWS_SIGNER_NOTATION_KEY_SHA256:\s+[0-9a-f]{64}\s*$''']
paths = ['''^\.github/workflows/release\.yml$''']

[[rules.allowlists]]
description = "Exact Docker DHI public signing-key commit and public-file checksum"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*(?:KEY_COMMIT = "d6b11e0475ac7ddf74687268d16a4201a15e163f"|KEY_SHA256 = "1d02bbccf149283ae6288d96264dcad3fb23ee1911d90324a48eab28e4cb8a5f")\s*$''']
paths = ['''^tools/fetch_dhi_attestations\.py$''']

[[rules.allowlists]]
description = "Amazon ECR Credential Helper v0.12.0 public ARM64 checksum"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*ECR_CREDENTIAL_HELPER_SHA256:\s+5bdd30fb6c7a92462f5b454cce1aa906ca7926a6c2e39efad9613a7bf7661fac\s*$''']
paths = ['''^\.github/workflows/release\.yml$''']

[[rules]]
id = "generic-password"

[[rules.allowlists]]
description = "Exact synthetic upload-password fixture, never a credential"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"UPLOAD_STORE_PASSWORD": "synthetic",\s*$''']
paths = ['''^tests/unit/tools/test_android_release\.py$''']

[[rules.allowlists]]
description = "Public-CA-only PKCS12 integrity password, never an authentication credential"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*selected \+ "Password": "public-only",\s*$''']
paths = ['''^tools/configure_build_tls\.py$''']
