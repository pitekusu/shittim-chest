[project]
name = "shittim-records"
version = "0.1.0"
description = "Read-model services for Shittim Chest Records"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.2,<0.17",
    "ty>=0.0.69,<0.1",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.8,<0.12"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
